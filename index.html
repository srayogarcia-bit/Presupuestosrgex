<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presupuestos SRGex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#E9EDEB; --surface:#FFFFFF; --surface-2:#F4F6F5; --ink:#172026; --muted:#5E6B70; --line:#D3DAD7;
  --accent:#235E4E; --accent-ink:#FFFFFF; --sel:#DDEBE5; --warn:#8A5300; --warn-bg:#FBF1DF; --danger:#A2362B;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#18201E; --surface-2:#1E2825; --ink:#E3EAE7; --muted:#94A29D; --line:#2D3935;
    --accent:#6DBBA2; --accent-ink:#0E1A16; --sel:#223630; --warn:#E6B566; --warn-bg:#2C2416; --danger:#E0786C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201E; --surface-2:#1E2825; --ink:#E3EAE7; --muted:#94A29D; --line:#2D3935;
  --accent:#6DBBA2; --accent-ink:#0E1A16; --sel:#223630; --warn:#E6B566; --warn-bg:#2C2416; --danger:#E0786C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font); font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.app{display:flex; flex-direction:column; height:100%}

/* Cabecera */
header{background:var(--head, var(--surface)); border-bottom:1px solid var(--line); padding:10px 16px 0}
.top{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap}
.ident{flex:1 1 280px; min-width:0}
.ident input{border:0; background:transparent; width:100%; padding:2px 0; font-weight:600}
#pName{font-size:20px; letter-spacing:-.01em}
#pName:hover,#pName:focus{background:var(--surface-2)}
.ident .sub{color:var(--muted); font-size:12.5px; display:flex; gap:10px; align-items:center}
#pCode{width:9ch; font-size:12.5px; font-weight:500; color:var(--muted)}
.figures{display:flex; gap:28px; align-items:flex-end}
.fig{text-align:right}
.fig span{display:block; font-size:12px; color:var(--muted)}
.fig b{display:block; font-weight:600; font-size:22px; letter-spacing:-.02em; line-height:1.15}
.fig.main b{font-size:30px; color:var(--accent)}
.tools{display:flex; gap:6px; padding:10px 0; overflow-x:auto; scrollbar-width:thin}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:6px 11px; white-space:nowrap; font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px; font-size:12.5px}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45; cursor:default}
.sep{width:1px; background:var(--line); margin:2px 4px; flex:none}

/* Pestañas móvil */
.tabs{display:none; border-top:1px solid var(--line); margin:0 -16px}
.tabs button{flex:1; border:0; background:transparent; padding:9px 4px; border-bottom:2px solid transparent; color:var(--muted); font-weight:500}
.tabs button.on{color:var(--ink); border-bottom-color:var(--accent)}

/* Paneles */
main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(300px,1fr) minmax(420px,1.45fr) minmax(300px,1fr); gap:1px; background:var(--line)}
.pane{background:var(--bg); min-height:0; min-width:0; display:flex; flex-direction:column}
.pane-head{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; min-height:47px}
.pane-head h2{font-size:13.5px; font-weight:600; margin:0 auto 0 0}
.scroll{overflow:auto; flex:1; min-height:0}

/* Árbol */
.tree{padding:6px 0}
.row{display:grid; grid-template-columns:18px 70px 1fr auto; gap:6px; align-items:baseline; width:100%; text-align:left; border:0; background:transparent; padding:5px 14px 5px 8px; border-left:3px solid transparent}
.row:hover{background-color:var(--surface-2)}
.row.sel{background-color:var(--sel); border-left-color:var(--accent)}
.row .caret{color:var(--muted); font-size:11px; border:0; background:transparent; padding:0; width:18px}
.row .code{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sum{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .amt{text-align:right; white-space:nowrap}
.row.chap{font-weight:600; padding-top:8px}
.row.chap .code{font-weight:600; color:var(--ink)}
.row.chap.sub{font-weight:500; padding-top:6px}
.row.item .sum{color:var(--ink)}
.row.item{padding-left:22px}
.row.item .amt{color:var(--muted)}
.row.item.sel .amt{color:var(--ink)}
.empty{padding:28px 20px; color:var(--muted); text-align:center}
.empty p{margin:0 0 12px}
.summary{border-top:1px solid var(--line); background:var(--surface); padding:10px 14px; flex:none}
.summary table{width:100%; border-collapse:collapse}
.summary td{padding:2px 0}
.summary td:last-child{text-align:right}
.summary .pct{width:5ch; border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:1px 4px; text-align:right}
.summary tr.tot td{font-weight:600; border-top:1px solid var(--line); padding-top:5px}

/* Detalle */
.detail{padding:16px 18px 32px; max-width:980px}
.grid{display:grid; grid-template-columns:130px 70px 1fr 130px; gap:10px}
label.f{min-width:0; display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted)}
label.f input,label.f textarea,label.f select{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:6px 8px; color:var(--ink); font-size:14px; width:100%}
label.f textarea{min-height:90px; resize:vertical; line-height:1.5}
.num{text-align:right}
.span4{grid-column:1/-1}
details.blk{margin-top:16px; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
details.blk>summary{padding:9px 12px; cursor:pointer; font-weight:600; font-size:13px; list-style:none; display:flex; gap:8px}
details.blk>summary::before{content:"▸"; color:var(--muted)}
details.blk[open]>summary::before{content:"▾"}
details.blk>summary em{font-style:normal; font-weight:400; color:var(--muted); margin-left:auto}
.blk-body{padding:0 12px 12px}
.note{background:var(--warn-bg); color:var(--warn); border-radius:6px; padding:8px 10px; font-size:12.5px; margin:10px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
table.t{width:100%; border-collapse:collapse; font-size:13px}
table.t th{text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
table.t td{padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
table.t th.num,table.t td.num{text-align:right}
.meas-wrap{overflow-x:auto}
table.meas td{padding:2px 3px}
table.meas input{width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:4px; color:var(--ink)}
table.meas input:hover{border-color:var(--line)}
table.meas input:focus{border-color:var(--accent); background:var(--surface)}
table.meas{min-width:700px} table.meas td:first-child{min-width:170px} table.meas .w-id{width:96px} table.meas .w-id input{color:var(--muted); font-size:12.5px} table.meas .w-n{width:62px} table.meas .w-d{width:78px} table.meas .w-p{width:92px} table.meas .w-x{width:34px}
table.meas td.parc{text-align:right; padding-right:8px; white-space:nowrap}
.bim{font-size:11px; color:var(--muted); padding:0 6px}
.meas-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:10px; flex-wrap:wrap}
.hint{font-size:12px; color:var(--muted)}
.big-tot{display:flex; gap:26px; justify-content:flex-end; margin-top:18px; padding-top:12px; border-top:2px solid var(--ink)}
.big-tot div{text-align:right}
.big-tot span{display:block; font-size:12px; color:var(--muted)}
.big-tot b{font-size:20px; font-weight:600}

/* Base */
.base-tools{padding:10px 14px; display:flex; gap:6px; border-bottom:1px solid var(--line); background:var(--surface)}
.base-tools input{flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:6px 9px; background:var(--surface)}
.base-tools.bt2{padding-top:0} .base-tools.bt2 select{flex:1; min-width:0}
.base-tools select{border:1px solid var(--line); border-radius:6px; padding:5px 6px; background:var(--surface)}
.res{border-bottom:1px solid var(--line); padding:9px 14px; display:grid; grid-template-columns:1fr auto; gap:3px 10px; cursor:pointer}
.res:hover{background:var(--surface-2)}
.res .rc{font-weight:600; font-size:12.5px}
.res .rp{text-align:right; white-space:nowrap}
.res .rs{grid-column:1/-1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.res.open .rs{display:block}
.res .rm{grid-column:1/-1; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; align-items:center}
.res .rt{grid-column:1/-1; font-size:12.5px; color:var(--muted); white-space:pre-wrap; display:none; margin-top:4px}
.res.open .rt{display:block}
.crumbs{display:flex; flex-wrap:wrap; gap:2px 4px; line-height:1.5} .crumbs a{color:var(--accent); text-decoration:none} .crumbs a:hover{text-decoration:underline} .crumbs b{color:var(--ink)}
.bt-chap{display:grid; grid-template-columns:22px auto 1fr auto; gap:8px; align-items:baseline; padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer}
.bt-chap:hover{background:var(--surface-2)} .bt-code{font-weight:600; font-size:12.5px} .bt-sum{font-weight:500} .bt-n{font-size:11.5px; color:var(--muted)}
.bt-up{padding:8px 14px; border-bottom:1px solid var(--line); cursor:pointer; color:var(--accent); font-size:13px} .bt-up:hover{background:var(--surface-2)}
.rpath{color:var(--muted); text-decoration:none; font-size:12px} .rpath:hover{color:var(--accent); text-decoration:underline}
.base-meta{padding:8px 14px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line)}

/* Modal y avisos */
.overlay{position:fixed; inset:0; background:rgba(10,20,16,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
.modal{background:var(--surface); border-radius:10px; max-width:560px; width:100%; max-height:85vh; overflow:auto; padding:18px 20px; box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px; font-size:16px}
.modal p,.modal li{color:var(--muted)}
.modal pre{background:var(--surface-2); padding:8px 10px; border-radius:6px; font-size:12px; overflow-x:auto}
.modal.wide{max-width:1280px; width:97vw; max-height:92vh; display:flex; flex-direction:column}
.rf-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap} .rf-head h3{margin:0 auto 0 0}
.rf-acts{display:flex; gap:6px; flex-wrap:wrap}
.rf-wrap{overflow:auto; flex:1; min-height:0; border:1px solid var(--line); border-radius:8px}
table.rt{min-width:1330px; font-size:12.5px}
table.rt th{position:sticky; top:0; background:var(--surface); z-index:1}
table.rt td{padding:3px 4px} table.rt input, table.rt select{border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:4px 5px; font-size:12.5px; color:var(--ink)}
table.rt select{max-width:128px}
table.rt td:first-child, table.rt th:first-child{position:sticky; left:0; background:var(--surface); z-index:2}
table.rt th:first-child{z-index:3}
table.rt .w-name{width:150px} table.rt .w-s{width:58px} table.rt .w-xs{width:42px} table.rt .w-h{width:150px}
/* Color por fase: fila entera tintada y cabecera de bloque en color pleno */
:root{--ph-act:#B5532A; --ph-act-bg:#FBE9DF; --ph-proy:#2E7D5B; --ph-proy-bg:#E1F2E8; --ph-uni:#6B7280; --ph-uni-bg:#EEF0F2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--ph-act:#E59A73; --ph-act-bg:#3A2219; --ph-proy:#6CC79E; --ph-proy-bg:#17312A; --ph-uni:#A5ADB8; --ph-uni-bg:#262B31} }
:root[data-theme="dark"]{--ph-act:#E59A73; --ph-act-bg:#3A2219; --ph-proy:#6CC79E; --ph-proy-bg:#17312A; --ph-uni:#A5ADB8; --ph-uni-bg:#262B31}
table.rt tr.act td{background:var(--ph-act-bg)} table.rt tr.proy td{background:var(--ph-proy-bg)} table.rt tr.unica td{background:var(--ph-uni-bg)}
table.rt tr.act td:first-child{box-shadow:inset 5px 0 0 var(--ph-act)} table.rt tr.proy td:first-child{box-shadow:inset 5px 0 0 var(--ph-proy)} table.rt tr.unica td:first-child{box-shadow:inset 5px 0 0 var(--ph-uni)}
table.rt tr.act select[data-rf-f="phase"]{border-color:var(--ph-act); color:var(--ph-act); font-weight:600}
table.rt tr.proy select[data-rf-f="phase"]{border-color:var(--ph-proy); color:var(--ph-proy); font-weight:600}
table.rt tr.sec td{position:sticky; left:0; font-weight:700; padding:8px 10px; color:#fff; letter-spacing:.01em}
table.rt tr.sec-act td{background:var(--ph-act)} table.rt tr.sec-proy td{background:var(--ph-proy)} table.rt tr.sec-unica td{background:var(--ph-uni)}
table.rt tr.sec .hint{color:rgba(255,255,255,.85)}
table.rt tr.sec td{position:static}
table.rt tr.sec .sec-lbl{position:sticky; left:10px; display:inline-flex; align-items:center; gap:6px}
table.rt input[type=checkbox]{width:17px; height:17px; accent-color:var(--ink)}
.rf-name{display:flex; align-items:center; gap:5px}
.rf-bulk{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; padding:8px 10px; margin:6px 0 8px; border:1px dashed var(--line); border-radius:8px; background:var(--surface-2); font-size:12.5px}
.rf-bulk label{display:flex; flex-direction:column; gap:2px; color:var(--muted); font-size:11.5px}
.rf-bulk select, .rf-bulk input{border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:3px 4px; font-size:12px; color:var(--ink)}
.warnlink{color:var(--warn); font-weight:600}
#saveState a{color:var(--accent)}
.fs-list{max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:8px}
.fs-row{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.fs-row.cur{background:var(--sel)}
.fs-name{font-weight:500; overflow-wrap:anywhere}
.fam{font-size:11px; font-weight:600; border-radius:999px; padding:1px 8px; margin-left:6px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.fam-P{background:#E3EEF8; color:#1F4E79; border-color:#B9D0E6} .fam-D{background:#FBEBDD; color:#8A4B12; border-color:#EBC9A8} .fam-T{background:#ECE6F5; color:#55348A; border-color:#D2C4E8}
.fs-cfg{display:flex; gap:8px; align-items:flex-end} .fs-cfg label{flex:1; display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted)} .fs-cfg input{border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--surface); color:var(--ink)}
.fs-acts{display:flex; gap:6px; flex-wrap:wrap}
.st-h{margin:14px 0 6px; font-size:13.5px}
.st-groups{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:13px}
.st-row{display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:8px; flex-wrap:wrap}
.st-row input{flex:1; min-width:180px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--surface); color:var(--ink)}
.st-row select{border:1px solid var(--line); border-radius:6px; padding:4px 6px; background:var(--surface); color:var(--ink); margin-left:6px}
.st-list{border:1px solid var(--line); border-radius:8px; max-height:28vh; overflow:auto}
.st-tpl{display:flex; justify-content:space-between; gap:8px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.mv-list{max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column}
.mv-row{all:unset; display:block; padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px}
.mv-row:hover{background:var(--surface-2)} .mv-row.cur{opacity:.55; cursor:default} .mv-row .code{font-weight:600; margin-right:4px}
.row.item[draggable="true"]{cursor:grab} .row.dragging{opacity:.4}
.row.drop-on{outline:2px dashed var(--accent); outline-offset:-2px}
td.w-pf{width:118px} td.w-pf input{width:100%}
input.pf-bad{border-color:var(--danger, #b42318) !important}
input.kg-man{background:#FFF4E5 !important}
.incr{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); margin-left:6px}
.incr input{width:52px}
tr.auto-row td{color:var(--muted); font-style:italic; font-size:12.5px}
.row.item.msel{background:var(--sel); box-shadow:inset 3px 0 0 var(--accent)}
.multi-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:7px 12px; background:var(--sel); border-bottom:1px solid var(--line); font-size:13px}
.multi-bar[hidden]{display:none} .multi-bar span{color:var(--muted); margin-right:auto}
.fam-list{max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:8px}
.fam-row{padding:8px 10px; border-bottom:1px solid var(--line); display:grid; gap:4px; font-size:13px}
.modal .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
#toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; max-width:90vw}
#toast.on{opacity:1}
.hidden{display:none !important}

.modes{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); align-self:center}
.modes button{border:0; background:transparent; padding:7px 13px; font-size:13px; font-weight:500; color:var(--muted)}
.modes button.on{background:var(--accent); color:var(--accent-ink)}
body[data-mode="cert"] .presu-only{display:none !important}
body:not([data-mode="cert"]) .cert-only{display:none !important}
body[data-mode="cert"]{--accent:#98600B; --accent-ink:#FFFFFF; --sel:#F4E4C4; --bg:#EEE8DC; --line:#DBD0BC; --surface-2:#F7F1E6; --head:#FBF3E2}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-mode="cert"]{--accent:#E2AE57; --accent-ink:#1A1206; --sel:#3A2D17; --bg:#15120C; --line:#3A3225; --surface-2:#221C12; --head:#1F1910} }
:root[data-theme="dark"] body[data-mode="cert"]{--accent:#E2AE57; --accent-ink:#1A1206; --sel:#3A2D17; --bg:#15120C; --line:#3A3225; --surface-2:#221C12; --head:#1F1910}
body[data-mode="cert"] header{box-shadow:inset 0 3px 0 var(--accent)}
.certbar{display:flex; gap:6px; padding:0 0 10px; overflow-x:auto; align-items:center}
.cchip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-size:12.5px; white-space:nowrap}
.cchip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.flag{font-size:10.5px; font-weight:600; border-radius:4px; padding:0 5px; margin-left:6px; white-space:nowrap; vertical-align:1px}
.flag.ojo{color:var(--warn); background:var(--warn-bg); border:1px dashed var(--warn)}
.flag.exc{color:#fff; background:var(--danger)}
.flag.done{color:var(--muted); border:1px solid var(--line)}
.flag.open{color:var(--accent); border:1px solid var(--accent)}
.pct{font-style:normal; font-size:11px; color:var(--muted); margin-left:8px; display:inline-block; min-width:5.5ch; text-align:right}

<script>
/* ===== Núcleo BC3 / cálculo (sin DOM) ===== */
const CP850 = "\u00c7\u00fc\u00e9\u00e2\u00e4\u00e0\u00e5\u00e7\u00ea\u00eb\u00e8\u00ef\u00ee\u00ec\u00c4\u00c5\u00c9\u00e6\u00c6\u00f4\u00f6\u00f2\u00fb\u00f9\u00ff\u00d6\u00dc\u00f8\u00a3\u00d8\u00d7\u0192\u00e1\u00ed\u00f3\u00fa\u00f1\u00d1\u00aa\u00ba\u00bf\u00ae\u00ac\u00bd\u00bc\u00a1\u00ab\u00bb\u2591\u2592\u2593\u2502\u2524\u00c1\u00c2\u00c0\u00a9\u2563\u2551\u2557\u255d\u00a2\u00a5\u2510\u2514\u2534\u252c\u251c\u2500\u253c\u00e3\u00c3\u255a\u2554\u2569\u2566\u2560\u2550\u256c\u00a4\u00f0\u00d0\u00ca\u00cb\u00c8\u0131\u00cd\u00ce\u00cf\u2518\u250c\u2588\u2584\u00a6\u00cc\u2580\u00d3\u00df\u00d4\u00d2\u00f5\u00d5\u00b5\u00fe\u00de\u00da\u00db\u00d9\u00fd\u00dd\u00af\u00b4\u00ad\u00b1\u2017\u00be\u00b6\u00a7\u00f7\u00b8\u00b0\u00a8\u00b7\u00b9\u00b3\u00b2\u25a0\u00a0";
const CP437 = "\u00c7\u00fc\u00e9\u00e2\u00e4\u00e0\u00e5\u00e7\u00ea\u00eb\u00e8\u00ef\u00ee\u00ec\u00c4\u00c5\u00c9\u00e6\u00c6\u00f4\u00f6\u00f2\u00fb\u00f9\u00ff\u00d6\u00dc\u00a2\u00a3\u00a5\u20a7\u0192\u00e1\u00ed\u00f3\u00fa\u00f1\u00d1\u00aa\u00ba\u00bf\u2310\u00ac\u00bd\u00bc\u00a1\u00ab\u00bb\u2591\u2592\u2593\u2502\u2524\u2561\u2562\u2556\u2555\u2563\u2551\u2557\u255d\u255c\u255b\u2510\u2514\u2534\u252c\u251c\u2500\u253c\u255e\u255f\u255a\u2554\u2569\u2566\u2560\u2550\u256c\u2567\u2568\u2564\u2565\u2559\u2558\u2552\u2553\u256b\u256a\u2518\u250c\u2588\u2584\u258c\u2590\u2580\u03b1\u00df\u0393\u03c0\u03a3\u03c3\u00b5\u03c4\u03a6\u0398\u03a9\u03b4\u221e\u03c6\u03b5\u2229\u2261\u00b1\u2265\u2264\u2320\u2321\u00f7\u2248\u00b0\u2219\u00b7\u221a\u207f\u00b2\u25a0\u00a0";

function decodeTable(u8, table) {
  let s = "";
  const CH = 8192;
  for (let i = 0; i < u8.length; i += CH) {
    const part = u8.subarray(i, i + CH);
    let chunk = "";
    for (let j = 0; j < part.length; j++) {
      const b = part[j];
      chunk += b < 128 ? String.fromCharCode(b) : table[b - 128];
    }
    s += chunk;
  }
  return s;
}

function decodeBC3(buf) {
  const u8 = new Uint8Array(buf);
  const w1252 = new TextDecoder("windows-1252");
  const head = w1252.decode(u8.subarray(0, Math.min(u8.length, 4000)));
  const m = head.match(/~V\|([^~]*)/);
  let cs = "ANSI";
  if (m) { const f = m[1].split("|"); cs = (f[4] || "").trim().toUpperCase(); }
  let text;
  if (cs === "850") text = decodeTable(u8, CP850);
  else if (cs === "437") text = decodeTable(u8, CP437);
  else text = w1252.decode(u8);
  return { text, charset: cs || "ANSI" };
}

const normCode = c => (c || "").trim().replace(/#+$/, "");

function parseNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/\s/g, "");
  if (!s) return 0;
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  s = s.replace(/[^0-9eE+\-.]/g, "");
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const isBlank = v => v === null || v === undefined || String(v).trim() === "";
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const r3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;

function parseBC3Text(text) {
  const concepts = {}; // norm code -> concept
  const decomp = {};   // norm parent -> [{code,factor,rend}]
  const texts = {};
  const meas = {};     // "parent\child" or "child" -> {total, lines}
  let version = {};
  for (let r of text.split("~")) {
    if (r.length < 2 || r.charAt(1) !== "|") continue;
    const t = r.charAt(0).toUpperCase();
    r = r.replace(/[\r\n\s]+$/, "");
    const f = r.slice(2).split("|");
    if (t === "V") {
      version = { owner: f[0] || "", format: (f[1] || "").split("\\")[0], program: f[2] || "", header: (f[3] || "").split("\\")[0] };
    } else if (t === "C") {
      const raw = (f[0] || "").split("\\")[0].trim();
      if (!raw) continue;
      const code = normCode(raw);
      concepts[code] = {
        code,
        unit: (f[1] || "").trim(),
        summary: (f[2] || "").trim(),
        price: parseNum((f[3] || "").split("\\")[0]),
        tipo: (f[5] || "").trim(),
        isRoot: /##$/.test(raw),
        isChapter: /#$/.test(raw)
      };
    } else if (t === "D") {
      const parent = normCode(f[0]);
      const sub = (f[1] || "").split("\\");
      const list = [];
      for (let i = 0; i < sub.length; i += 3) {
        const c = normCode(sub[i]);
        if (!c) continue;
        list.push({ code: c, factor: isBlank(sub[i + 1]) ? 1 : parseNum(sub[i + 1]), rend: isBlank(sub[i + 2]) ? 1 : parseNum(sub[i + 2]) });
      }
      decomp[parent] = list;
    } else if (t === "T") {
      texts[normCode(f[0])] = (f[1] || "").replace(/\r\n/g, "\n").trim();
    } else if (t === "M") {
      const key = (f[0] || "").split("\\").map(normCode).join("\\");
      const sub = (f[3] || "").split("\\");
      const lines = [];
      for (let i = 0; i + 5 < sub.length + 1; i += 6) {
        const tipo = (sub[i] || "").trim();
        const g = [sub[i + 1], sub[i + 2], sub[i + 3], sub[i + 4], sub[i + 5]];
        if (g.every(isBlank) && isBlank(tipo)) continue;
        if (tipo === "1" || tipo === "2") continue; // subtotales
        let com = (g[0] || "").trim(), bim = "";
        const hi = com.indexOf("#");
        if (hi >= 0) { bim = com.slice(hi + 1); com = com.slice(0, hi); }
        const n = x => isBlank(x) ? "" : String(parseNum(x));
        lines.push({ c: com, n: n(g[1]), l: n(g[2]), a: n(g[3]), h: n(g[4]), bim });
      }
      meas[key] = { total: parseNum(f[2]), lines };
    }
  }
  for (const k in texts) if (concepts[k]) concepts[k].text = texts[k];
  return { concepts, decomp, meas, version };
}

/* Descomposición: filas con importe, soporta conceptos % sobre lo acumulado */
function decompRows(list, concepts, depth = 0, memo = {}) {
  const rows = [];
  let acc = 0;
  for (const d of list || []) {
    const c = concepts[d.code] || { code: d.code, unit: "", summary: "(sin definir)", price: 0 };
    let price, imp;
    if (d.code.startsWith("%")) {
      price = acc / 100;
      imp = r2(price * d.factor * d.rend);
    } else {
      price = conceptPrice(d.code, concepts, depth + 1, memo);
      imp = r2(price * d.factor * d.rend);
    }
    acc += imp;
    rows.push({ code: d.code, unit: c.unit, summary: c.summary, factor: d.factor, rend: d.rend, price, imp });
  }
  return { rows, total: r2(acc) };
}
function conceptPrice(code, concepts, depth = 0, memo = {}) {
  if (memo[code] !== undefined) return memo[code];
  const c = concepts[code];
  if (!c) return 0;
  if (c.price || !c.decomp || !c.decomp.length || depth > 12) return (memo[code] = c.price || 0);
  memo[code] = 0;
  return (memo[code] = decompRows(c.decomp, concepts, depth, memo).total);
}

/* Construye la base de precios navegable */
function buildBase(parsed, name) {
  const { concepts, decomp } = parsed;
  const parentOf = {};
  for (const p in decomp) {
    const pc = concepts[p];
    if (pc && (pc.isChapter || pc.isRoot)) for (const d of decomp[p]) parentOf[d.code] = pc.summary;
  }
  const map = {};
  for (const k in concepts) {
    const c = concepts[k];
    map[k] = { ...c, decomp: decomp[k] || [] };
  }
  const memo = {};
  for (const k in map) if (!map[k].price && map[k].decomp.length) map[k].price = conceptPrice(k, map, 0, memo);
  const list = [];
  for (const k in map) {
    const c = map[k];
    if (c.isChapter || c.isRoot) continue;
    c.parent = parentOf[k] || "";
    c.isPartida = c.decomp.length > 0 && !k.startsWith("%");
    list.push(k);
  }
  list.sort();
  return { name, count: list.length, map, list, loadedAt: new Date().toISOString() };
}

/* Copia al proyecto los conceptos de la descomposición (recursivo) */
function collectConcepts(code, srcMap, dest, depth = 0) {
  const c = srcMap[code];
  if (!c || depth > 12) return;
  for (const d of c.decomp || []) {
    if (dest[d.code]) continue;
    const s = srcMap[d.code];
    if (!s) continue;
    dest[d.code] = { code: s.code, unit: s.unit, summary: s.summary, price: s.price, tipo: s.tipo || "", decomp: (s.decomp || []).map(x => ({ ...x })) };
    collectConcepts(d.code, srcMap, dest, depth + 1);
  }
}

let _uid = Date.now() % 100000;
const uid = p => p + (++_uid).toString(36) + Math.random().toString(36).slice(2, 5);

function itemFromConcept(c, srcMap, projConcepts) {
  collectConcepts(c.code, srcMap, projConcepts);
  return {
    id: uid("i"), code: c.code, unit: c.unit, summary: c.summary, text: c.text || "",
    price: r2(c.price || 0), basePrice: r2(c.price || 0), priceEdited: false,
    decomp: (c.decomp || []).map(x => ({ ...x })), lines: [], qty: ""
  };
}

/* Abre un BC3 como presupuesto (aplana subcapítulos) */
function budgetFromParsed(parsed, fileName) {
  const { concepts, decomp, meas } = parsed;
  const srcMap = {};
  for (const k in concepts) srcMap[k] = { ...concepts[k], decomp: decomp[k] || [] };
  let root = Object.values(concepts).find(c => c.isRoot);
  if (!root) {
    const children = new Set();
    for (const p in decomp) for (const d of decomp[p]) children.add(d.code);
    root = Object.values(concepts).find(c => c.isChapter && !children.has(c.code)) || null;
  }
  const P = newProject();
  P.name = root ? (root.summary || fileName) : fileName;
  P.code = root ? root.code : "PRES";
  const walk = (chapCode, parentId) => {
    const cc = concepts[chapCode] || { code: chapCode, summary: "" };
    const ch = { id: uid("c"), code: chapCode, summary: cc.summary, items: [], collapsed: false, parentId: parentId || null };
    P.chapters.push(ch);
    for (const d of decomp[chapCode] || []) {
      const c = srcMap[d.code];
      if (c && (c.isChapter || c.isRoot)) { walk(d.code, ch.id); continue; }
      const base = c || { code: d.code, unit: "", summary: "(concepto sin definir)", price: 0, decomp: [] };
      const it = itemFromConcept(base, srcMap, P.concepts);
      if (!it.price && it.decomp.length) it.price = it.basePrice = conceptPrice(d.code, srcMap);
      const m = meas[chapCode + "\\" + d.code] || meas[d.code];
      if (m && m.lines.length) it.lines = m.lines.map(l => ({ ...l }));
      else it.qty = String(r3(d.rend * d.factor));
      ch.items.push(it);
    }
  };
  if (root) for (const d of decomp[root.code] || []) {
    const c = concepts[d.code];
    if (c && c.isChapter) walk(d.code, null);
  }
  return P;
}

function newProject() {

    r.onsuccess = () => res(r.result ?? null); r.onerror = () => res(null); } catch(e){ res(null); } }); },
  set(k, v){ return new Promise(res => { if(!this.db) return res(false); try { const tx = this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch(e){ res(false); } }); }
};

let downloadsNS;
const dlReady = (async () => { try { if (window.claude && claude.use) downloadsNS = await claude.use("downloads"); } catch(e){ downloadsNS = null; } })();
async function saveFile(filename, data){
  if (!/\.json$/i.test(filename) && await fsSaveExport(filename, data)) return true;
  await Promise.race([dlReady, new Promise(r => setTimeout(r, 1500))]);
  if (downloadsNS) {
    try { await downloadsNS.save({ filename, data }); toast("Archivo guardado: " + filename); return true; }
    catch(e){
      if (e && e.code === "declined") { toast("Descarga cancelada"); return false; }
      if (e && e.code === "rate_limited") { toast("Hay otra descarga pendiente de confirmar"); return false; }
      toast("No se pudo guardar el archivo (" + (e && e.code || "error") + ")"); return false;
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch(e){ toast("No se pudo descargar el archivo"); return false; }
}

/* ===== Prontuario de acero (kg/m y kg/m²) =====
   Laminados: pesos de tabla (series UNE-EN 10365). Tubos: masa calculada según UNE-EN 10219 (radios exteriores
   2t, 2,5t o 3t). Corrugado, redondo, pletina, chapa y malla: geometría × 7.850 kg/m³. */
const ACERO = (() => {
  const T = {}, add = (serie, pares) => pares.split(" ").forEach(p => { const [d, kg] = p.split(":"); T[serie + " " + d] = +kg; });
  add("IPE", "80:6.0 100:8.1 120:10.4 140:12.9 160:15.8 180:18.8 200:22.4 220:26.2 240:30.7 270:36.1 300:42.2 330:49.1 360:57.1 400:66.3 450:77.6 500:90.7 550:106 600:122");
  add("HEA", "100:16.7 120:19.9 140:24.7 160:30.4 180:35.5 200:42.3 220:50.5 240:60.3 260:68.2 280:76.4 300:88.3 320:97.6 340:105 360:112 400:125 450:140 500:155 550:166 600:178");
  add("HEB", "100:20.4 120:26.7 140:33.7 160:42.6 180:51.2 200:61.3 220:71.5 240:83.2 260:93.0 280:103 300:117 320:127 340:134 360:142 400:155 450:171 500:187 550:199 600:212");
  add("HEM", "100:41.8 120:52.1 140:63.2 160:76.2 180:88.9 200:103 220:117 240:157 260:172 280:189 300:238 320:245 340:248 360:250 400:256 450:263 500:270 550:278 600:285");
  add("IPN", "80:5.94 100:8.34 120:11.1 140:14.3 160:17.9 180:21.9 200:26.2 220:31.1 240:36.2 260:41.9 280:47.9 300:54.2 320:61.0 340:68.0 360:76.1 380:84.0 400:92.4");
  add("UPN", "80:8.64 100:10.6 120:13.4 140:16.0 160:18.8 180:22.0 200:25.3 220:29.4 240:33.2 260:37.9 280:41.8 300:46.2 320:59.5 350:60.6 380:63.1 400:71.8");
  add("L", "20x3:0.88 25x3:1.12 30x3:1.36 30x4:1.78 35x4:2.09 40x4:2.42 40x5:2.97 45x5:3.38 50x5:3.77 50x6:4.47 60x6:5.42 70x7:7.38 80x8:9.63 90x9:12.2 100x10:15.0 120x12:21.6");
  const r3 = x => Math.round(x * 1000) / 1000;
  const rect = (B, H, t) => { const ro = t <= 6 ? 2 * t : t <= 10 ? 2.5 * t : 3 * t, ri = ro - t; return r3((2 * t * (B + H - 2 * t) - (4 - Math.PI) * (ro * ro - ri * ri)) * 0.00785); };
  const circ = (D, t) => r3(Math.PI * t * (D - t) * 0.00785);
  const barra = d => r3(Math.PI * d * d / 4 * 0.00785);
  // Tubos de catálogo (para el desplegable); cualquier otra medida se calcula igual al escribirla
  "20x1.5 20x2 30x2 30x3 40x2 40x3 40x4 50x2 50x3 50x4 50x5 60x3 60x4 60x5 70x3 70x4 70x5 80x3 80x4 80x5 80x6 90x4 90x5 90x6 100x4 100x5 100x6 100x8 120x5 120x6 120x8 140x5 140x6 140x8 150x5 150x6 150x8 150x10 160x6 160x8 160x10 200x6 200x8 200x10"
    .split(" ").forEach(s => { const [b, t] = s.split("x").map(Number); T[`#${b}x${b}x${String(t).replace(".", ",")}`] = rect(b, b, t); });
  "40x20x2 50x30x2 50x30x3 60x40x2 60x40x3 60x40x4 80x40x3 80x40x4 100x50x3 100x50x4 100x50x5 100x60x4 100x60x5 120x60x4 120x60x5 120x80x4 120x80x5 120x80x6 140x80x5 140x80x6 150x100x5 150x100x6 150x100x8 160x80x5 160x80x6 200x100x5 200x100x6 200x100x8 200x100x10"
    .split(" ").forEach(s => { const [b, h, t] = s.split("x").map(Number); T[`#${b}x${h}x${t}`] = rect(b, h, t); });
  "33.7x2.6 42.4x2.6 48.3x3.2 60.3x3.2 76.1x3.2 88.9x3.2 88.9x4 101.6x4 114.3x4 114.3x5 139.7x5 168.3x5 168.3x6"
    .split(" ").forEach(s => { const [d, t] = s.split("x").map(Number); T[`Ø${String(d).replace(".", ",")}x${String(t).replace(".", ",")}`] = circ(d, t); });
  [6, 8, 10, 12, 14, 16, 20, 25, 32].forEach(d => T[`B500S Ø${d}`] = barra(d));
  const num = s => parseFloat(String(s).replace(",", "."));
  /* Interpreta lo que se escriba: «IPE 120», «ipe120», «HEB-200», «L 50x5», «#100x100x5», «TR 100x50x4»,
     «CHS 114,3x4», «Ø12» (corrugado), «R 20» (redondo), «PL 100x10» (pletina), «CH 8» (chapa, kg/m²),
     «ME 15x15 5-5» (malla, kg/m²) */
  function lookup(txt){
    const s = String(txt || "").trim(); if (!s) return null;
    const u = s.toUpperCase().replace(/[–—]/g, "-").replace(/\s+/g, " ");
    let m = u.match(/^(IPE|HEA|HEB|HEM|IPN|UPN)\s*-?\s*(\d{2,3})\b/);
    if (m && T[m[1] + " " + m[2]]) return { name: m[1] + " " + m[2], kg: T[m[1] + " " + m[2]], ud: "kg/m", src: "tabla" };
    m = u.match(/^L\s*-?\s*(\d+)\s*[X×]\s*(\d+)$/) || u.match(/^L\s*-?\s*(\d+)\s*[X×]\s*\1\s*[X×]\s*(\d+)$/);
    if (m && T[`L ${m[1]}x${m[2]}`]) return { name: `L ${m[1]}x${m[2]}`, kg: T[`L ${m[1]}x${m[2]}`], ud: "kg/m", src: "tabla" };
    m = u.match(/^(?:#|SHS|RHS|TC|TR|TUBO)?\s*(\d+(?:[.,]\d+)?)\s*[X×]\s*(\d+(?:[.,]\d+)?)\s*[X×]\s*(\d+(?:[.,]\d+)?)$/);
    if (m){ const [B, H, t] = [num(m[1]), num(m[2]), num(m[3])]; return { name: `#${m[1]}x${m[2]}x${m[3]}`, kg: rect(B, H, t), ud: "kg/m", src: "UNE-EN 10219" }; }
    m = u.match(/^(?:CHS|Ø|TUBO RED(?:ONDO)?)\s*(\d+(?:[.,]\d+)?)\s*[X×]\s*(\d+(?:[.,]\d+)?)$/);
    if (m) return { name: `Ø${m[1]}x${m[2]}`, kg: circ(num(m[1]), num(m[2])), ud: "kg/m", src: "UNE-EN 10219" };
    m = u.match(/^(?:B500[SC]?\s*)?Ø\s*(\d+)$/) || u.match(/^(?:CORRUGADO|B500[SC]?)\s*Ø?\s*(\d+)$/);
    if (m) return { name: `B500S Ø${m[1]}`, kg: barra(num(m[1])), ud: "kg/m", src: "geometría" };
    m = u.match(/^(?:R|REDONDO)\s*(\d+(?:[.,]\d+)?)$/);
    if (m) return { name: `Redondo Ø${m[1]}`, kg: barra(num(m[1])), ud: "kg/m", src: "geometría" };
    m = u.match(/^(?:PL|PLETINA)\s*(\d+(?:[.,]\d+)?)\s*[X×]\s*(\d+(?:[.,]\d+)?)$/);
    if (m) return { name: `PL ${m[1]}x${m[2]}`, kg: r3(num(m[1]) * num(m[2]) * 0.00785), ud: "kg/m", src: "geometría" };
    m = u.match(/^(?:CH|CHAPA)\s*(\d+(?:[.,]\d+)?)$/);
    if (m) return { name: `Chapa ${m[1]} mm`, kg: r3(num(m[1]) * 7.85), ud: "kg/m²", src: "geometría" };
    m = u.match(/^ME\s*(\d+)\s*[X×]\s*(\d+)\s*(?:Ø|A)?\s*(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)$/);
    if (m){ const sx = num(m[1]) / 100, sy = num(m[2]) / 100; return { name: `ME ${m[1]}x${m[2]} Ø${m[3]}-${m[4]}`, kg: r3(barra(num(m[3])) / sy + barra(num(m[4])) / sx), ud: "kg/m²", src: "geometría" }; }
    return null;
  }
  return { T, lookup, names: Object.keys(T) };
})();
/* Aplica el prontuario a una línea de medición de una partida en kg: el peso unitario va en la columna Alto */
function aceroAplicar(l){
  const r = ACERO.lookup(l.pf || "") || (!l.pf ? ACERO.lookup(l.c || "") : null);
  if (!r) return false;
  l.pf = r.name; l.h = String(r.kg); l.kgSrc = "p";
  return true;
}
const esKg = it => /^kg$/i.test(String(it.unit || "").trim());
/* Qué prontuario tiene sentido en la partida, según su descripción: «perfil» (laminados, tubos, cerrajería…),
   «barra» (acero corrugado: solo diámetros) o nada. Se puede activar a mano en cualquier partida en kg. */
function aceroModo(it){
  if (!esKg(it)) return null;
  if (it.useProntuario) return "perfil";
  const t = (String(it.summary || "") + " " + String(it.text || "")).toUpperCase();
  if (/\bS\s?2[37]5|\bS\s?355|LAMINAD|PERFIL|TUBO|\bIPE\b|\bHE[ABM]\b|\bUPN\b|ESTRUCTURA MET|CERRAJ|PLETINA|ANGULAR|CHAPA/.test(t)) return "perfil";
  if (/CORRUGAD|B\s?500|B\s?400|ARMADUR|FERRALLA/.test(t)) return "barra";
  return null;
}
/* Despuntes y solapes: línea automática al final, recalculada con el resto */
function syncIncr(it){
  const pct = parseNum(it.incr);
  const i = it.lines.findIndex(l => l.bim === "AUTO:despuntes");
  if (!(pct > 0)){ if (i >= 0){ it.lines.splice(i, 1); } return; }
  const base = it.lines.reduce((s, l) => l.bim === "AUTO:despuntes" ? s : s + lineParcial(l), 0);
  const line = { c: `Despuntes y solapes ${String(pct).replace(".", ",")} %`, n: String(pct / 100), l: String(r2(base)), a: "", h: "", bim: "AUTO:despuntes" };
  if (i >= 0) Object.assign(it.lines[i], line); else it.lines.push(Object.assign({ id: uid("l") }, line));
  if (i >= 0 && i !== it.lines.length - 1){ const [x] = it.lines.splice(i, 1); it.lines.push(x); }
}

function itemDetail(it){
  const hasLines = it.lines.length > 0;
  const dec = it.decomp && it.decomp.length ? decompRows(it.decomp, P.concepts) : null;
  const decHtml = dec ? `<details class="blk"><summary>Descomposición <em>${it.decomp.length} conceptos · ${m2(dec.total)} €</em></summary><div class="blk-body meas-wrap">

/* --- Render: base de precios --- */
let baseQuery = "", baseFilter = "partidas", openRes = null;
const fold = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
let baseIndex = null;
let baseCwd = null, baseRoot = null, baseParent = {}, baseGroup = "";
function buildIndex(){
  baseIndex = BASE ? BASE.list.map(k => [k, fold(k + " " + BASE.map[k].summary)]) : null;
  baseParent = {}; baseRoot = null; baseCwd = null; baseGroup = ""; for (const k in _topMemo) delete _topMemo[k];
  if (!BASE) return;
  for (const k in BASE.map){
    const c = BASE.map[k];
    if (c.isRoot && !baseRoot) baseRoot = k;
    if (c.isChapter || c.isRoot) for (const d of c.decomp || []) if (!baseParent[d.code]) baseParent[d.code] = k;
  }
  baseCwd = baseRoot;
}
const _topMemo = {};
function baseTop(code){
  if (_topMemo[code] !== undefined) return _topMemo[code];
  let k = code, prev = code, g = 0;
  while (k && baseParent[k] && baseParent[k] !== baseRoot && g++ < 12){ prev = baseParent[k]; k = prev; }
  return (_topMemo[code] = baseParent[code] ? prev : code);
}
function basePath(code){
  const out = []; let k = code, guard = 0;
  while (k && guard++ < 12){ out.unshift(k); k = baseParent[k]; }
  return out;
}
const resRow = c => `<div class="res ${openRes === c.code ? "open" : ""}" data-act="resToggle" data-code="${esc(c.code)}">
      <span class="rc">${esc(c.code)}</span><span class="rp">${m2(c.price)} €/${esc(c.unit || "ud")}</span>
      <span class="rs">${esc(c.summary)}</span>
      ${c.text ? `<span class="rt">${esc(c.text)}</span>` : ""}`;
function renderBase(){
  if (isCert()) return renderCertPanel();
  const box = $("#baseBody");
  $("#btnBaseSmall").textContent = BASE ? "Cambiar" : "Cargar BC3";
  if (!BASE){
    box.innerHTML = `<div class="empty"><p>Carga un BC3 de base de precios, por ejemplo la base de la Junta de Extremadura.</p><p>Se guarda en este navegador y no hay que volver a cargarla.</p><button class="btn primary" data-act="loadBase">Cargar base BC3</button></div>`;
    return;
  }
  const had = box.querySelector("#bq");
  if (!had){
    box.innerHTML = `<div class="base-tools"><input id="bq" type="search" placeholder="Buscar código o texto" aria-label="Buscar en la base" autocomplete="off">
      <select id="bf" aria-label="Filtro"><option value="partidas">Partidas</option><option value="todo">Todo</option></select></div>
      <div class="base-tools bt2"><select id="bg" aria-label="Grupo de la base"></select></div>
      <div class="base-meta" id="bmeta"></div><div id="bres"></div>`;
    $("#bq").value = baseQuery; $("#bf").value = baseFilter;
    const groups = baseRoot ? (BASE.map[baseRoot].decomp || []).map(d => BASE.map[d.code]).filter(c => c && (c.isChapter || c.isRoot)) : [];
    $("#bg").innerHTML = `<option value="">Todos los grupos</option>` + groups.map(g => `<option value="${esc(g.code)}">${esc(g.code)} · ${esc(g.summary)}</option>`).join("");
    $("#bg").value = baseGroup;
    $("#bq").addEventListener("input", e => { baseQuery = e.target.value; renderResults(); });
    $("#bf").addEventListener("change", e => { baseFilter = e.target.value; renderResults(); });
    $("#bg").addEventListener("change", e => {
      baseGroup = e.target.value;
      if (!baseQuery.trim()){ baseCwd = baseGroup || baseRoot; }
      renderResults();
    });
  }
  renderResults();
}
function renderResults(){
  const words = fold(baseQuery).split(/\s+/).filter(Boolean);
  if (!words.length && baseRoot){ if (baseGroup && (!baseCwd || baseCwd === baseRoot || baseTop(baseCwd) !== baseGroup)) baseCwd = baseGroup; return renderBaseTree(); }
  const out = [];
  let total = 0;
  for (const [k, hay] of baseIndex){
    const c = BASE.map[k];
    if (baseFilter === "partidas" && !c.isPartida) continue;
    if (baseGroup && baseTop(k) !== baseGroup) continue;
    if (words.length && !words.every(w => hay.includes(w))) continue;
    total++;
    if (out.length < 150) out.push(c);
  }
  $("#bmeta").textContent = `${BASE.name} · ${BASE.count.toLocaleString("es-ES")} conceptos` + (words.length ? ` · ${total.toLocaleString("es-ES")} resultados${baseGroup ? " en " + baseGroup : ""}` : "") + (total > 150 ? " (se muestran 150: elige un grupo o afina la búsqueda)" : "");
  $("#bres").innerHTML = out.length ? out.map(c => {
      const par = baseParent[c.code], pc = par && BASE.map[par];
      return resRow(c) + `<span class="rm">${pc ? `<a href="#" class="rpath" data-act="baseGo" data-code="${esc(par)}" title="Ver dónde está en la base">📁 ${esc(par)} · ${esc(pc.summary)}</a>` : `<span></span>`}<button class="btn small" data-act="addFromBase" data-code="${esc(c.code)}">Añadir</button></span></div>`;
    }).join("")
    : `<div class="empty"><p>Sin resultados. Prueba con otra palabra o cambia el filtro a «Todo».</p></div>`;
}
/* Navegación por capítulos de la base, como en la propia base de la Junta */
function renderBaseTree(){
  const cwd = BASE.map[baseCwd] ? baseCwd : baseRoot, cur = BASE.map[cwd];
  const path = basePath(cwd);
  $("#bmeta").innerHTML = `<div class="crumbs">${path.map((k, i) => {
      const c = BASE.map[k], label = i === 0 ? "Base" : `${k} ${c.summary}`;
      return i === path.length - 1 ? `<b title="${esc(c.summary)}">${esc(label)}</b>` : `<a href="#" data-act="baseGo" data-code="${esc(k)}" title="${esc(c.summary)}">${esc(label)}</a>`;
    }).join(" › ")}</div>`;
  const kids = (cur.decomp || []).map(d => BASE.map[d.code]).filter(Boolean);
  const chaps = kids.filter(c => c.isChapter || c.isRoot);
  const leaves = kids.filter(c => !(c.isChapter || c.isRoot) && (baseFilter !== "partidas" || c.isPartida));
  const count = c => (c.decomp || []).length;
  $("#bres").innerHTML = (path.length > 1 ? `<div class="bt-up" data-act="baseGo" data-code="${esc(path[path.length - 2])}">↰ Subir a ${esc(path.length > 2 ? path[path.length - 2] : "la base")}</div>` : "")
    + chaps.map(c => `<div class="bt-chap" data-act="baseGo" data-code="${esc(c.code)}"><span class="bt-ico">📁</span><span class="bt-code">${esc(c.code)}</span><span class="bt-sum">${esc(c.summary)}</span><span class="bt-n">${count(c)}</span></div>`).join("")
    + leaves.slice(0, 400).map(c => resRow(c) + `<span class="rm"><span></span><button class="btn small" data-act="addFromBase" data-code="${esc(c.code)}">Añadir</button></span></div>`).join("")
    + (!chaps.length && !leaves.length ? `<div class="empty"><p>Este capítulo no tiene ${baseFilter === "partidas" ? "partidas (cambia el filtro a «Todo» para ver materiales y mano de obra)" : "conceptos"}.</p></div>` : "")
    + (leaves.length > 400 ? `<div class="empty"><p>Se muestran 400 de ${leaves.length}. Usa el buscador para afinar.</p></div>` : "");
}
function renderAll(){
  document.body.dataset.mode = isCert() ? "cert" : "presu";

const isNarrow = () => window.matchMedia("(max-width: 700px)").matches;
window.matchMedia("(min-width: 701px) and (max-width: 1100px)").addEventListener("change", () => showTab(curTab));
function flatItems(){ const out = []; for (const { ch } of chapOrder(P)) for (const it of ch.items) out.push({ ch, it }); return out; }
function stepItem(d){
  const all = flatItems(); if (!all.length) return;
  let i = all.findIndex(x => x.it.id === sel.item);
  i = i < 0 ? (d > 0 ? 0 : all.length - 1) : Math.max(0, Math.min(all.length - 1, i + d));
  const { ch, it } = all[i];
  let c = ch; while (c){ c.collapsed = false; c = c.parentId ? findChap(c.parentId) : null; }
  sel = { chap: ch.id, item: it.id };

const actions = {

function move(d){
  if (sel.item){
    const f = findItem(sel.item); if (!f) return;
    const arr = f.chap.items, i = arr.indexOf(f.item), j = i + d;
    if (j < 0 || j >= arr.length){
      // en el borde del capítulo: pasa al capítulo anterior o siguiente
      const order = chapOrder(P).map(o => o.ch), k = order.indexOf(f.chap), dest = order[k + d];
      if (!dest) return;
      return moveItemTo(f.item.id, dest.id, d < 0 ? null : (dest.items[0] ? dest.items[0].id : null));
    }
    [arr[i], arr[j]] = [arr[j], arr[i]];
  } else if (sel.chap){
    const arr = P.chapters, ch = findChap(sel.chap);
    const sib = arr.filter(c => (c.parentId || null) === (ch.parentId || null));
    const k = sib.indexOf(ch), other = sib[k + d];
    if (!other) return;
    const i = arr.indexOf(ch), j = arr.indexOf(other);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  } else return;
  renderTree(); markDirty();
}
/* Mueve una partida a otro capítulo (al final, o delante de beforeId) */
function moveItemTo(itemId, chapId, beforeId){
  const f = findItem(itemId), dest = findChap(chapId); if (!f || !dest) return;
  if (beforeId === itemId) return;
  f.chap.items.splice(f.chap.items.indexOf(f.item), 1);
  const k = beforeId ? dest.items.findIndex(i => i.id === beforeId) : -1;
  if (k < 0) dest.items.push(f.item); else dest.items.splice(k, 0, f.item);
  dest.collapsed = false;
  sel = { chap: dest.id, item: itemId };
  renderAll(); markDirty();
  if (f.chap !== dest) toast(`${f.item.code || "Partida"} movida a ${dest.code ? dest.code + " " : ""}${dest.summary}`);
}
function addPastedLines(txt){
  const f = findItem(sel.item); if (!f || !txt.trim()) return;
  const it = f.item;
  if (!it.lines.length && parseNum(it.qty)) it.lines.push({ c: "Cantidad anterior", n: "", l: String(parseNum(it.qty)), a: "", h: "", bim: "" });
  let n = 0;
  for (const row of txt.replace(/\r/g, "").split("\n")){
    if (!row.trim()) continue;
    const c = row.split("\t");
    const val = x => isBlank(x) ? "" : String(parseNum(x));
    it.lines.push({ c: (c[0] || "").trim(), n: val(c[1]), l: val(c[2]), a: val(c[3]), h: val(c[4]), bim: (c[5] || "").trim() }); n++;
  }
  it.qty = ""; renderDetail(); refreshTreeAmounts(); markDirty(); toast(n + " líneas añadidas");
}

/* --- Excel --- */
function buildXlsx(P){
  const wb = XLSX.utils.book_new();
  const T = totals(P);
  const FMT2 = "#,##0.00", FMT3 = "#,##0.000";
  // Presupuesto
  const LB = docLabels(P);
  const order = chapOrder(P);
  const rows = [[P.name], [], ["Código", "Ud", "Resumen", "Medición", "Precio", "Importe"]];
  const fcells = [];
  const chapRow = {}, ownRange = {};
  order.forEach(({ ch }) => {
    chapRow[ch.id] = rows.length; rows.push([ch.code, "", ch.summary, "", "", chapTotalDeep(ch, P)]);
    const first = rows.length;
    ch.items.forEach(it => {
      const r = rows.length;
      rows.push([it.code, it.unit, it.summary, itemQty(it), it.price, itemImporte(it)]);
      fcells.push({ r, c: 5, f: `ROUND(D${r + 1}*E${r + 1},2)`, v: itemImporte(it), z: FMT2 });
      fcells.push({ r, c: 3, v: itemQty(it), z: FMT2 }); fcells.push({ r, c: 4, v: it.price, z: FMT2 });
    });
    if (ch.items.length) ownRange[ch.id] = [first + 1, rows.length];
  });
  order.forEach(({ ch }) => {
    const parts = [];
    if (ownRange[ch.id]) parts.push(`SUM(F${ownRange[ch.id][0]}:F${ownRange[ch.id][1]})`);
    order.filter(o => o.ch.parentId === ch.id).forEach(o => parts.push("F" + (chapRow[o.ch.id] + 1)));
    fcells.push({ r: chapRow[ch.id], c: 5, f: parts.join("+") || null, v: chapTotalDeep(ch, P), z: FMT2 });
  });
  const topRows = order.filter(o => o.depth === 0).map(o => chapRow[o.ch.id] + 1);
  rows.push([]);
  const pemRow = rows.length;
  rows.push(["", "", "Presupuesto de ejecución material", "", "", T.pem]);
  fcells.push({ r: pemRow, c: 5, f: topRows.map(r => "F" + r).join("+") || null, v: T.pem, z: FMT2 });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  for (const fc of fcells){ const a = XLSX.utils.encode_cell({ r: fc.r, c: fc.c }); ws[a] = { t: "n", v: fc.v, z: fc.z }; if (fc.f) ws[a].f = fc.f; }
  ws["!cols"] = [{ wch: 14 }, { wch: 6 }, { wch: 70 }, { wch: 12 }, { wch: 11 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws, "Presupuesto");
  // Mediciones
  const mr = [["Código", "Ud", "Resumen / comentario", "Uds", "Largo", "Ancho", "Alto", "Parcial", "Medición", "Id elemento"]];
  const mf = [];
  const nv = v => isBlank(v) ? "" : parseNum(v);
  order.forEach(({ ch }) => {
    mr.push([ch.code, "", ch.summary]);
    ch.items.forEach(it => {
      const hr = mr.length; mr.push([it.code, it.unit, it.summary]);
      if (it.lines.length){
        const first = mr.length;
        it.lines.forEach(l => {
          const r = mr.length;
          mr.push(["", "", l.c, nv(l.n), nv(l.l), nv(l.a), nv(l.h), lineParcial(l), "", bimOut(l.bim)]);
          mf.push({ r, c: 7, f: `IF(COUNT(D${r + 1}:G${r + 1})=0,0,PRODUCT(D${r + 1}:G${r + 1}))`, v: lineParcial(l), z: FMT3 });
        });
        mf.push({ r: hr, c: 8, f: `ROUND(SUM(H${first + 1}:H${mr.length}),2)`, v: itemQty(it), z: FMT2 });
      } else mf.push({ r: hr, c: 8, v: itemQty(it), z: FMT2 });
    });
    mr.push([]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(mr);
  for (const fc of mf){ const a = XLSX.utils.encode_cell({ r: fc.r, c: fc.c }); ws2[a] = { t: "n", v: fc.v, z: fc.z }; if (fc.f) ws2[a].f = fc.f; }
  ws2["!cols"] = [{ wch: 14 }, { wch: 6 }, { wch: 60 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Mediciones");
  // Resumen
  const rr = [[P.name], [], ["Capítulo", "Resumen", "Importe", "%"]];
  const rf = [];
  const c0 = rr.length;
  const tops = order.filter(o => o.depth === 0).map(o => o.ch);
  tops.forEach(ch => { const r = rr.length; rr.push([ch.code, ch.summary, chapTotalDeep(ch, P), ""]); rf.push({ r, c: 2, v: chapTotalDeep(ch, P), z: FMT2 }); });
  const cN = rr.length - 1;
  rr.push([]);
  const pr = rr.length;
  rr.push(["", "Presupuesto de ejecución material", T.pem]);
  rf.push({ r: pr, c: 2, f: tops.length ? `SUM(C${c0 + 1}:C${cN + 1})` : null, v: T.pem, z: FMT2 });
  tops.forEach((ch, i) => rf.push({ r: c0 + i, c: 3, f: `IF($C$${pr + 1}=0,0,C${c0 + i + 1}/$C$${pr + 1})`, v: T.pem ? chapTotalDeep(ch, P) / T.pem : 0, z: "0.00%" }));
  const add = (label, pct, f, v) => { const r = rr.length; rr.push(["", label, v, pct]); rf.push({ r, c: 2, f, v, z: FMT2 }); if (pct !== "") rf.push({ r, c: 3, v: pct / 100, z: "0.00%" }); return r; };
  const gr = add("Gastos generales", parseNum(P.gg), `ROUND(C${pr + 1}*D${rr.length + 1},2)`, T.gg);
  const br = add("Beneficio industrial", parseNum(P.bi), `ROUND(C${pr + 1}*D${rr.length + 1},2)`, T.bi);
  const sr = add(LB.contrata, "", `C${pr + 1}+C${gr + 1}+C${br + 1}`, T.base);
  const ir = add("IVA", parseNum(P.iva), `ROUND(C${sr + 1}*D${rr.length + 1},2)`, T.iva);
  add(LB.general, "", `C${sr + 1}+C${ir + 1}`, T.total);
  const ws3 = XLSX.utils.aoa_to_sheet(rr);
  for (const fc of rf){ const a = XLSX.utils.encode_cell({ r: fc.r, c: fc.c }); ws3[a] = { t: "n", v: fc.v, z: fc.z }; if (fc.f) ws3[a].f = fc.f; }
  ws3["!cols"] = [{ wch: 10 }, { wch: 50 }, { wch: 15 }, { wch: 9 }];
  XLSX.utils.book_append_sheet(wb, ws3, "Resumen");
  return wb;
}

/* ===== Carpeta de proyectos (OneDrive) — File System Access API, Chrome/Edge de escritorio ===== */
const FS = { root: null, ok: false, mt: {}, savedAt: null, err: false, subName: "" };
const EXP_RE = /^\d{4}_\d{2,4}_/;   // formato de expediente AAAA_NNN_TIPO_Cliente
/* Destino del presupuesto dentro del expediente (plantilla del estudio, carpetas reconocidas por su número):
   dirección de obra (DOB, DEO, CSS, CFO, LDE) → 5_Documentación obra · resto → 4_Proyecto / 4_2_Mediciones.
   La app no crea la estructura: eso lo hace ArchiDesk al dar de alta el expediente. */
const TIPOS_OBRA = ["DOB", "DEO", "CSS", "CFO", "LDE"];
function tipoDe(dir){ const m = String(dir).match(/^\d{4}_\d{2,4}_([A-Za-z]+)/); return m ? m[1].toUpperCase() : null; }
function destinoDe(dir){ return TIPOS_OBRA.includes(tipoDe(dir)) ? ["5"] : ["4", "4_2"]; }
const fsSupported = () => "showDirectoryPicker" in window && window.self === window.top;
const fsKey = () => P.file ? [P.file.dir, P.file.sub || "", P.file.name].join("/") : "";
function fsStatus(){
  const el = $("#saveState"); if (!el) return;
  const btn = $("#fsBtn");
  if (!fsSupported()){ if (btn) btn.classList.add("hidden"); return; }
  if (btn) btn.classList.remove("hidden");
  if (!FS.root){ el.innerHTML = `Solo en este navegador · <a href="#" data-act="fsPick">elegir carpeta de proyectos</a>`; return; }
  if (!FS.ok){ el.innerHTML = `<a href="#" data-act="fsReconnect" class="warnlink">⚠ Carpeta sin conectar: pulsa para permitir el acceso</a>`; return; }
  if (!P.file){ el.innerHTML = `Sin expediente · <a href="#" data-act="misPresupuestos">guardar en un expediente</a>`; return; }
  const t = FS.savedAt ? FS.savedAt.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) : "";
  el.innerHTML = FS.err ? `<span class="warnlink">⚠ No se pudo guardar en ${esc(P.file.dir)}</span>` : `📁 ${esc(P.file.dir)}${P.file.sub ? " / " + esc(P.file.sub) : ""} · ${esc(P.file.name)}${t ? " · guardado " + t : ""}`;
}
async function fsInit(){
  if (!fsSupported()) return fsStatus();
  try {
    const h = await store.get("dirHandle");
    if (h){ FS.root = h; FS.ok = (await h.queryPermission({ mode: "readwrite" })) === "granted"; }
    FS.subName = (await store.get("fsSub")) || "";
  } catch(e){ FS.ok = false; }
  fsStatus();
  if (FS.ok && P.file) fsCheckNewer();
}
async function fsPick(){
  try {
    const h = await window.showDirectoryPicker({ mode: "readwrite", id: "srgex-proyectos" });
    FS.root = h; FS.ok = true; await store.set("dirHandle", h); fsStatus(); actions.misPresupuestos();
  } catch(e){ if (e.name !== "AbortError") toast("No se ha podido acceder a la carpeta"); }
}
async function fsReconnect(){
  if (!FS.root) return fsPick();
  try { FS.ok = (await FS.root.requestPermission({ mode: "readwrite" })) === "granted"; } catch(e){ FS.ok = false; }
  fsStatus();
  if (FS.ok){ toast("Carpeta conectada"); if (P.file) fsCheckNewer(true); }
}
async function fsWalk(dh, path, create){
  for (const part of String(path || "").split(/[\\/]+/).filter(Boolean)) dh = await dh.getDirectoryHandle(part, { create: !!create });
  return dh;
}
/* Subcarpeta del expediente donde van los presupuestos: la configurada a mano; si no, la de la plantilla
   (por número de prefijo, sin crear nada); si el expediente no la tiene, una que contenga «presupuesto» o
   «medición»; y si tampoco, la raíz del expediente. */
async function fsSubFor(dh, create, dirName){
  if (FS.subName){ const h = await fsWalk(dh, FS.subName, create); return { h, name: FS.subName, pdf: FS.subName }; }
  let h = dh; const path = [];
  for (const num of destinoDe(dirName || dh.name)){
    let found = null;
    for await (const [n, c] of h.entries()) if (c.kind === "directory" && n.startsWith(num + "_")){ found = [n, c]; break; }
    if (!found){ h = null; break; }
    path.push(found[0]); h = found[1];
  }
  if (h && path.length) return { h, name: path.join("/"), pdf: path.join("/") };
  let alt = null;
  for await (const [n, c] of dh.entries()){
    if (c.kind !== "directory") continue;
    if (/presupuest/i.test(n)) return { h: c, name: n, pdf: n };
    if (!alt && /medici/i.test(n)) alt = { h: c, name: n, pdf: n };
  }
  return alt || { h: dh, name: "", pdf: "" };
}
async function fsFileHandle(dir, name, create, sub){
  const dh = await fsWalk(await FS.root.getDirectoryHandle(dir), sub === undefined ? (P.file && P.file.sub) : sub, create);
  return dh.getFileHandle(name, { create: !!create });
}
let fsTimer = null;
function fsSchedule(){ if (!P.file || !FS.root) return; clearTimeout(fsTimer); fsTimer = setTimeout(() => fsWrite(), 1200); }
async function fsWrite(force){
  if (!P.file || !FS.root) return;
  if (!FS.ok){ fsStatus(); return; }
  try {
    const fh = await fsFileHandle(P.file.dir, P.file.name, true, P.file.sub), key = fsKey();
    const cur = await fh.getFile();
    if (!force && FS.mt[key] && cur.lastModified > FS.mt[key] + 1500) return fsConflict(cur);
    const w = await fh.createWritable(); await w.write(JSON.stringify(P, null, 1)); await w.close();
    FS.mt[key] = (await fh.getFile()).lastModified; FS.savedAt = new Date(); FS.err = false;
  } catch(e){ FS.err = true; if (e.name === "NotAllowedError") FS.ok = false; }
  fsStatus();
}
/* Al abrir o reconectar: si el archivo de la carpeta es más reciente (se editó en el otro equipo), se ofrece cargarlo */
async function fsCheckNewer(){
  try {
    const fh = await fsFileHandle(P.file.dir, P.file.name, false, P.file.sub), f = await fh.getFile(), key = fsKey();
    if (!FS.mt[key] && f.lastModified > (P.localAt || 0) + 2000){ FS.mt[key] = f.lastModified; return fsConflict(f, true); }
    FS.mt[key] = FS.mt[key] || f.lastModified;
  } catch(e){ /* aún no existe: se creará al guardar */ }
}
function fsConflict(f, newer){
  const when = new Date(f.lastModified).toLocaleString("es-ES");
  modal("El presupuesto ha cambiado en la carpeta", `<p>${newer ? "La versión de la carpeta del expediente es más reciente que la de este navegador" : "Mientras trabajabas, el archivo se ha modificado desde otro sitio (probablemente desde el otro ordenador)"}: <b>${esc(P.file.dir)} / ${esc(P.file.name)}</b>, modificado el ${when}.</p><p>¿Con cuál te quedas?</p>`,
    [{ label: "Cargar la de la carpeta", primary: true, run: async () => { await fsOpen(P.file.dir, P.file.name, P.file.sub); } },
     { label: "Quedarme con la de aquí (sobrescribir)", danger: true, run: () => fsWrite(true) }]);
}
async function fsOpen(dir, name, sub){
  try {
    const fh = await fsFileHandle(dir, name, false, sub || ""), f = await fh.getFile();
    const np = JSON.parse(await f.text());
    if (!np || !Array.isArray(np.chapters)) throw new Error("formato");
    P = Object.assign(newProject(), np); P.file = { dir, sub: sub || "", name }; ensureIds(P);
    FS.mt[fsKey()] = f.lastModified; FS.savedAt = new Date(f.lastModified); FS.err = false;
    sel = { chap: P.chapters[0] ? P.chapters[0].id : null, item: null };
    $("#baseBody").innerHTML = ""; renderAll(); renderBase();
    await store.set("project", JSON.parse(JSON.stringify(P)));
    fsStatus(); toast(`Abierto ${name}`);
  } catch(e){ toast("No se ha podido abrir ese presupuesto"); }
}
async function fsList(){
  const out = [];
  for await (const [name, h] of FS.root.entries()){
    if (h.kind !== "directory" || /^[._]/.test(name)) continue;
    const files = [], exp = EXP_RE.test(name), subs = [];
    const scan = async (dh, sub) => { for await (const [fn, fh] of dh.entries()) if (fh.kind === "file" && /\.srgex\.json$/i.test(fn)) files.push({ name: fn, sub }); };
    try {
      await scan(h, "");
      if (exp){
        // busca en todas las subcarpetas de primer nivel (y en la configurada, aunque esté más profunda)
        for await (const [sn, sh] of h.entries()) if (sh.kind === "directory"){ subs.push(sn); await scan(sh, sn).catch(() => {}); }
        const t = await fsSubFor(h, false, name).catch(() => null);
        if (t && t.name.includes("/")) await scan(t.h, t.name).catch(() => {});
        if (FS.subName && /[\\/]/.test(FS.subName)){ const d = await fsWalk(h, FS.subName, false).catch(() => null); if (d) await scan(d, FS.subName); }
      }
    } catch(e){}
    out.push({ name, exp, files, tipo: tipoDe(name) });
  }
  return out.sort((a, b) => (b.exp - a.exp) || b.name.localeCompare(a.name, "es"));
}
actions.fsPick = () => fsPick();
actions.fsReconnect = () => fsReconnect();

/* ===== Estructura de capítulos: desde la base de la Junta o desde plantillas ===== */
const TPL_BUILTIN = [{ id: "srgex-vivienda", builtin: true, name: "Vivienda (estructura de tu presupuesto visado)", chapters: [
  ["E01", "ACTUACIONES PREVIAS"], ["E02", "MOVIMIENTO DE TIERRAS"], ["E03", "RED DE SANEAMIENTO ENTERRADA"], ["E04", "CIMENTACIONES"], ["E05", "ESTRUCTURAS"],

  ["E11", "ALICATADOS, CHAPADOS Y PREFABRICADOS"], ["E12", "INSTALACIONES"], ["E12_E", "ELECTRICIDAD", "E12"], ["E12_F", "FONTANERÍA", "E12"],
  ["E13", "CARPINTERÍA, CERRAJERÍA Y PROTECCIONES"], ["E14", "VIDRIOS"], ["E15", "PINTURAS Y ACABADOS"], ["E16", "MOBILIARIO, EQUIPAMIENTO Y SEÑALIZACIÓN"],
  ["E17", "MEDIDAS CORRECTORAS FRENTE AL GAS RADÓN"], ["E_RES", "CONTROL DE CALIDAD"], ["E18", "GESTIÓN DE RESIDUOS"], ["E19", "SEGURIDAD Y SALUD"]
].map(([code, summary, parent]) => ({ code, summary, parent: parent || null })) }];
async function tplAll(){ return TPL_BUILTIN.concat((await store.get("chapTemplates")) || []); }
/* Inserta los capítulos que falten (por código), respetando lo que ya hay */
function applyStructure(list){
  let added = 0;
  const byCode = c => P.chapters.find(x => x.code === c);
  for (const t of list){
    if (byCode(t.code)) continue;
    const par = t.parent ? byCode(t.parent) : null;
    const ch = { id: uid("c"), code: t.code, summary: t.summary, items: [], collapsed: false, parentId: par ? par.id : null };
    const sibs = P.chapters.filter(x => (x.parentId || null) === ch.parentId);
    const after = sibs.filter(x => x.code.localeCompare(ch.code, "es", { numeric: true }) < 0).pop();
    if (P.chapters.length && after) P.chapters.splice(P.chapters.indexOf(after) + 1, 0, ch);
    else if (P.chapters.length && sibs.length) P.chapters.splice(P.chapters.indexOf(sibs[0]), 0, ch);
    else P.chapters.push(ch);
    added++;
  }
  renderAll(); markDirty();
  return added;
}
function emptyChapters(){
  const has = ch => ch.items.length || P.chapters.some(c => c.parentId === ch.id && has(c));
  return P.chapters.filter(c => !has(c));
}
/* Estructura de la base cargada: grupos raíz (E, U, S…) y profundidad */
function baseStructure(groups, depth){
  const out = [];
  const walk = (code, parent, level) => {
    for (const d of BASE.map[code].decomp || []){
      const c = BASE.map[d.code];

function rfHuecos(str){
  return String(str || "").split(/[;\n]+/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.replace(/,/g, ".").match(/([\d.]+)\s*[x×]\s*([\d.]+)(?:\s*\+\s*([\d.]+))?/i);
    if (!m) return null;
    const w = +m[1], h = +m[2];
    return { w, h, s: m[3] !== undefined ? +m[3] : (h >= 1.9 ? 0 : 1.0) };
  }).filter(Boolean);
}
function rfThreshold(code){
  const c = (BASE && BASE.map[code]) || P.concepts[code];
  let t = (c && c.text) || "";
  if (!t) for (const ch of P.chapters) for (const it of ch.items) if (it.code === code) t = it.text || "";
  if (/sin deducir huecos/i.test(t)) return Infinity;
  const m = t.match(/deduciendo huecos[^.]*?(?:superiores|mayores)\s*(?:a|de)\s*([\d.,]+)\s*m/i);

/* Genera las líneas de medición de todas las estancias */
const rfSkips = [];
function rfBuild(){
  rfSkips.length = 0;
  const rows = [], f2 = x => String(r2(x)), fc = x => String(r2(x)).replace(".", ",");
  const push = (key, r, line) => rows.push({ code: rfCode(key), line: Object.assign({ n: "1", l: "", a: "", h: "" }, line, { bim: `EST:${r.id}:${key}${line.suf || ""}` }) });

    const a = r.a || {}, A = parseNum(r.area), Pm = parseNum(r.perim), Hf = parseNum(r.height);
    const hFT = parseNum(r.hft), H = hFT > 0 && Hf ? Math.min(Hf, hFT) : Hf;   // paredes solo hasta el falso techo: el plénum no se reviste
    const hA = Math.min(parseNum(a.hAlic) || 2.2, H || 99);
    _rfH = H || 0;
    const toTxt = hFT > 0 ? " hasta falso techo" : "";
    const hz = rfHuecos(r.huecos), has = (z, ch) => (a[z] || "").includes(ch);
    const alicBand = has("alic", "L") || has("alic", "N");
    const Ld = Math.min(parseNum(r.ldem), Pm);         // muros de la estancia que se derriban: su revestimiento cae con ellos
    const isDem = key => /_dem$/.test(key);
    const band = (key, z0, z1, label) => {          // paramentos verticales entre z0 y z1
      const P0 = isDem(key) ? Pm - Ld : Pm;
      if (!(P0 > 0 && z1 > z0)) return;
      push(key, r, { c: `${r.name} · ${label}: perímetro${isDem(key) && Ld ? ` (sin ${fc(Ld)} m de muro derribado)` : ""} × altura`, l: f2(P0), h: f2(z1 - z0) });
      const X = rfThreshold(rfCode(key));
      hz.forEach((o, i) => {
        if (o.w * o.h <= X) return;
        const piece = Math.max(0, Math.min(z1, o.s + o.h) - Math.max(z0, o.s));
        if (piece > 0.001) push(key, r, { c: `  A deducir hueco ${fc(o.w)} × ${fc(o.h)}`, n: "-1", l: f2(o.w), h: f2(piece), suf: `:h${i}` });
      });
    };
    const area = (key, label) => { if (A) push(key, r, { c: `${r.name} · ${label}`, l: f2(A) }); };

    if (has("suelo", "L")) area("solado_dem", "solado");
    if (has("suelo", "N")){ area("recrecido", "recrecido"); area("solado_new", "solado"); }

    if (has("alic", "L")) band("alic_dem", 0, hA, `alicatado hasta ${fc(hA)} m`);
    if (has("alic", "N")) band("alic_new", 0, hA, `alicatado hasta ${fc(hA)} m`);
    // Yeso y pintura en paredes (por encima del alicatado si lo hay)
    const z0 = alicBand ? hA : 0;
    if (has("yeso", "L")) band("yeso_dem", z0, H, "paredes" + toTxt);
    if (has("yeso", "N")) band("yeso_new", z0, H, "paredes" + toTxt);
    if (has("pint", "P")) band("pint_par", z0, H, "paredes" + toTxt);
    // Techo
    if (has("techo", "L")) area("techo_dem", "falso techo");
    // Yeso en el techo: no se guarnece donde va falso techo nuevo
    if (has("techoy", "L")) area("techoy_dem", "techo");
    if (has("techoy", "N")){ if (has("techo", "N")) rfSkips.push(r.name); else area("techoy_new", "techo"); }

    const rod = key => {
      const P0 = isDem(key) ? Pm - Ld : Pm;
      if (!(P0 > 0)) return;
      push(key, r, { c: `${r.name} · rodapié: perímetro${isDem(key) && Ld ? ` (sin ${fc(Ld)} m de muro derribado)` : ""}`, l: f2(P0) });

    if (has("rod", "N")) rod("rod_new");

  }

}
function rfChapterFor(code){
  let best = null;
  for (const c of P.chapters) if (c.code && code.startsWith(c.code) && (!best || c.code.length > best.code.length)) best = c;
  if (best) return best;
  const pre = code.slice(0, 3), bc = BASE && BASE.map[pre];
  const ch = { id: uid("c"), code: pre, summary: bc && bc.isChapter ? bc.summary : "Reforma por estancias", items: [], collapsed: false, parentId: null };
  const nxt = P.chapters.findIndex(c => !c.parentId && c.code > pre);
  if (nxt < 0) P.chapters.push(ch); else P.chapters.splice(nxt, 0, ch);

}
function rfApply(){
  ensureIds(P);
  const rows = rfBuild(), byCode = {};
  rows.forEach(r => (byCode[r.code] = byCode[r.code] || []).push(r.line));
  const st = { upd: 0, add: 0, del: 0, kept: 0, created: 0 }, missing = [];
  const seen = new Set();
  for (const code in byCode){
    let it = null;
    for (const c of P.chapters){ it = c.items.find(i => i.code === code); if (it) break; }
    if (!it){
      const b = BASE && BASE.map[code];
      if (!b || b.isChapter){ missing.push(code); continue; }
      it = itemFromConcept(b, BASE.map, P.concepts); it.origin = "EST"; rfChapterFor(code).items.push(it); st.created++;
    }
    if (!it.lines.length && parseNum(it.qty)) it.lines.push({ id: uid("l"), c: "Cantidad anterior", n: "", l: String(parseNum(it.qty)), a: "", h: "", bim: "" });
    it.qty = "";
    for (const nl of byCode[code]){
      const ex = it.lines.find(l => l.bim === nl.bim);
      if (ex){ Object.assign(ex, { c: nl.c, n: nl.n, l: nl.l, a: nl.a, h: nl.h }); seen.add(ex.id); st.upd++; }
      else { const l = Object.assign({ id: uid("l") }, nl); it.lines.push(l); seen.add(l.id); st.add++; }
    }
  }
  // Retira las líneas de estancias que ya no se generan (acción desmarcada, estancia borrada…)
  for (const ch of P.chapters){
    ch.items.forEach(it => {
      it.lines = it.lines.filter(l => {
        if (!String(l.bim || "").startsWith("EST:") || seen.has(l.id)) return true;
        if (lineCertAt(P, it, l.id) >= 0){ st.kept++; return true; }
        st.del++; return false;
      });
    });
    ch.items = ch.items.filter(it => !(it.origin === "EST" && !it.lines.length));
  }
  renderAll(); markDirty();
  return { st, missing, n: rows.length };
}

    <label>Plantilla<select data-bz="tpl"><option value="">—</option>${Object.entries(RF_TPL).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join("")}</select></label>

/* Ajusta lo marcado a la fase: actual → solo demoliciones; proyectado → solo nuevo; única → todo */
function rfPhaseFit(r){
  if (r.phase === "unica") return;
  for (const z of RF_ZONES){
    const v = r.a[z.k] || "";
    if (r.phase === "proy") r.a[z.k] = z.k === "pint" ? v : (v.includes("N") ? "N" : "");
    else r.a[z.k] = z.k === "pint" ? "" : (v.includes("L") ? "L" : "");
  }
  if (r.phase === "proy") r.a.san = "";
}
function rfClick(e){
  const b = e.target.closest("[data-rf]"); if (!b) { if (e.target.classList.contains("overlay")) $("#modalRoot").innerHTML = ""; return; }
  const act = b.dataset.rf, tr = b.closest("tr"), i = tr ? +tr.dataset.ri : -1;
  if (act === "close"){ $("#modalRoot").innerHTML = ""; return; }
  if (act === "add"){ P.rooms.push({ id: uid("r"), name: "Estancia " + (P.rooms.length + 1), phase: "unica", area: "", perim: "", height: "2.6", huecos: "", a: { hAlic: 2.2 } }); rfRender(); markDirty(); return; }
  if (act === "del"){ rfSel.delete(P.rooms[i].id); P.rooms.splice(i, 1); rfRender(); markDirty(); return; }
  if (act === "imp"){ $("#fRooms").value = ""; $("#fRooms").click(); return; }
  if (act === "codes") return rfCodesDialog();
  if (act === "unsel"){ rfSel.clear(); rfRender(); return; }
  if (act === "bulk"){
    const v = k => { const el = document.querySelector(`#rfBulk [data-bz="${k}"]`); return el ? el.value : ""; };
    const tpl = v("tpl"), hft = v("hft");
    let n = 0, fixed = 0;
    for (const r of P.rooms){
      if (!rfSel.has(r.id)) continue; r.a = r.a || {}; n++;
      if (tpl){ RF_TPL[tpl].set(r); if (tpl === "bano" && r.phase === "proy" && parseNum(r.hft)) r.a.hAlic = parseNum(r.hft); }
      const before = JSON.stringify(r.a);
      for (const z of RF_ZONES){ const val = v(z.k); if (val !== "__") r.a[z.k] = val; }
      const want = JSON.stringify(r.a); rfPhaseFit(r); if (JSON.stringify(r.a) !== want && want !== before) fixed++;
      if (!isBlank(hft)) r.hft = String(parseNum(hft));
      if ((r.a.techo || "").includes("N") && !parseNum(r.hft)) r.hft = "2.5";
    }
    markDirty(); rfRender();
    toast(`Aplicado a ${n} estancias` + (fixed ? `. En ${fixed} se ha ajustado a su fase (actual: solo demoliciones; proyectado: solo nuevo)` : ""));
    return;
  }
  if (act === "gen"){
    if (!BASE) toast("Sin base de precios cargada solo se actualizan las partidas que ya están en el presupuesto");
    const { st, missing, n } = rfApply();
    if (rfSkips.length) setTimeout(() => toast(`Yeso de techo no medido en ${rfSkips.join(", ")}: llevan falso techo nuevo`), 2500);
    const msg = `${n} líneas: ${st.add} nuevas, ${st.upd} actualizadas, ${st.del} retiradas${st.created ? `, ${st.created} partidas creadas` : ""}${st.kept ? `, ${st.kept} conservadas por estar certificadas` : ""}.${missing.length ? " Sin partida: " + missing.join(", ") : ""}`;
    $("#modalRoot").innerHTML = "";
    modal("Mediciones de reforma generadas", `<p>${esc(msg)}</p><p class="hint">Si cambias algo en las estancias y vuelves a generar, se actualiza solo lo que cambia. Las líneas que hayas metido a mano no se tocan.</p>`, [{ label: "Volver a estancias", run: rfOpen }, { label: "Hecho", primary: true }]);
  }
}
function rfInput(e){
  const t = e.target;
  if ("selsec" in t.dataset){ P.rooms.filter(r => (r.phase || "unica") === t.dataset.selsec).forEach(r => t.checked ? rfSel.add(r.id) : rfSel.delete(r.id)); rfRender(); return; }
  if (t.closest("#rfBulk")) return;
  const tr = t.closest("tr[data-ri]"); if (!tr) return;
  const r = P.rooms[+tr.dataset.ri]; r.a = r.a || {};
  if ("sel" in t.dataset){ t.checked ? rfSel.add(r.id) : rfSel.delete(r.id); rfBulkBar(); const hs = document.querySelector(`[data-selsec="${r.phase || "unica"}"]`); if (hs) hs.checked = P.rooms.filter(x => (x.phase || "unica") === (r.phase || "unica")).every(x => rfSel.has(x.id)); return; }
  if (t.dataset.rfF){
    const k = t.dataset.rfF; r[k] = ["area", "perim", "height", "ldem", "hft"].includes(k) ? (isBlank(t.value) ? "" : String(parseNum(t.value))) : t.value;
    if (k === "phase" && e.type === "change"){ rfPhaseFit(r); rfRender(); }
  }
  else if (t.dataset.rz){
    r.a[t.dataset.rz] = t.value;
    if (t.dataset.rz === "techo" && t.value.includes("N") && !parseNum(r.hft)){ r.hft = "2.5"; const c = tr.querySelector('[data-rf-f="hft"]'); if (c) c.value = "2,5"; toast(`${r.name}: falso techo a 2,50 m; ajústalo si es otra altura`); }
  }
  else if (t.dataset.ra) r.a[t.dataset.ra] = isBlank(t.value) ? "" : parseNum(t.value);
  else if ("tpl" in t.dataset && e.type === "change" && t.value){
    RF_TPL[t.value].set(r); rfPhaseFit(r); if ((r.a.techo || "").includes("N") && !parseNum(r.hft)) r.hft = "2.5";
    if (t.value === "bano" && r.phase === "proy" && parseNum(r.hft)) r.a.hAlic = parseNum(r.hft);
    rfRender();
  }
  markDirty();
}
