/* ===== Actualizar precios a la base cargada ===== */
function compareWithBase(){
  const rows = [];
  for (const { ch } of chapOrder(P)) for (const it of ch.items){
    const b = BASE.map[it.code];
    const q = itemQty(it);
    if (!b || b.isChapter){ rows.push({ it, ch, kind: "gone", q }); continue; }
    const np = r2(b.price || 0), dp = r2(np - (it.price || 0));
    const txt = (b.text || "") !== (it.text || "") || b.summary !== it.summary || b.unit !== it.unit;
    if (Math.abs(dp) < 0.005 && !txt) continue;
    rows.push({ it, ch, kind: it.priceEdited ? "manual" : "change", b, np, dp, pct: it.price ? dp / it.price * 100 : 0, imp: r2(q * np) - r2(q * (it.price || 0)), txt, q });
  }
  return rows;
}
actions.updateBase = function(){
  if (!BASE) return toast("Carga primero la base de precios con la que quieres comparar");
  if (!P.chapters.length) return toast("El presupuesto está vacío");
  const rows = compareWithBase();
  const ch = rows.filter(r => r.kind === "change"), man = rows.filter(r => r.kind === "manual"), gone = rows.filter(r => r.kind === "gone");
  if (!rows.length) return modal("Comparar con la base", `<p>Todas las partidas del presupuesto coinciden con <b>${esc(BASE.name)}</b>. No hay nada que actualizar.</p>`, [{ label: "Hecho", primary: true }]);
  const T0 = totals(P).pem, dTot = ch.reduce((s, r) => s + r.imp, 0);
  const tr = (r, i) => `<tr><td><input type="checkbox" data-ui="${i}" ${r.kind === "change" ? "checked" : ""}></td><td><b>${esc(r.it.code)}</b><br><span class="hint">${esc(r.it.summary).slice(0, 70)}</span>${r.txt ? `<br><span class="flag done">texto o resumen cambia</span>` : ""}${r.kind === "manual" ? `<br><span class="flag ojo">precio fijado a mano</span>` : ""}</td>
    <td class="num">${m2(r.it.price)}</td><td class="num"><b>${m2(r.np)}</b></td><td class="num" style="color:${r.dp > 0 ? "var(--danger)" : "var(--accent)"}">${r.dp > 0 ? "+" : ""}${NFU.format(Math.round(r.pct * 10) / 10)} %</td><td class="num">${r.imp > 0 ? "+" : ""}${m2(r.imp)}</td></tr>`;
  const list = [...ch, ...man];
  modal(`Comparar con ${BASE.name}`, `
    <p>${ch.length} partidas cambian de precio o de texto${man.length ? `, ${man.length} tienen precio fijado a mano (desmarcadas)` : ""}${gone.length ? ` y ${gone.length} no existen en esta base` : ""}.</p>
    <p>Ejecución material: <b>${m2(T0)}</b> → <b>${m2(T0 + dTot)}</b> si aplicas todos los cambios marcados (${dTot >= 0 ? "+" : ""}${NFU.format(T0 ? Math.round(dTot / T0 * 1000) / 10 : 0)} %).</p>
    ${list.length ? `<div class="meas-wrap" style="max-height:46vh;overflow:auto"><table class="t"><thead><tr><th><input type="checkbox" id="uiAll" checked aria-label="Marcar todas"></th><th>Partida</th><th class="num">Actual</th><th class="num">Base</th><th class="num">Var.</th><th class="num">Efecto</th></tr></thead><tbody>${list.map(tr).join("")}</tbody></table></div>` : ""}
    ${gone.length ? `<p>No existen en ${esc(BASE.name)} (se quedan como están; revisa si han cambiado de código):</p><pre>${esc(gone.map(r => r.it.code + "  " + r.it.summary).join("\n"))}</pre>` : ""}
    <p class="hint">Se actualizan precio, unidad, resumen, texto y descomposición. Las mediciones no se tocan.</p>`,
    [{ label: "Cancelar" }, { label: "Aplicar marcadas", primary: true }]);
  const all = $("#uiAll"); if (all) all.onchange = () => document.querySelectorAll("[data-ui]").forEach(c => { c.checked = all.checked; });
  document.querySelector('#modalRoot [data-mi="1"]').onclick = () => {
    const pick = [...document.querySelectorAll("[data-ui]")].filter(c => c.checked).map(c => list[+c.dataset.ui]);
    $("#modalRoot").innerHTML = "";
    for (const r of pick){
      const b = BASE.map[r.it.code], it = r.it;
      it.price = r2(b.price || 0); it.basePrice = it.price; it.priceEdited = false;
      it.unit = b.unit; it.summary = b.summary; it.text = b.text || "";
      it.decomp = (b.decomp || []).map(x => ({ ...x }));
      const fresh = {}; collectConcepts(it.code, BASE.map, fresh); Object.assign(P.concepts, fresh);
    }
    if (pick.length) P.baseName = BASE.name;
    renderAll(); markDirty();
    toast(pick.length ? `${pick.length} partidas actualizadas a ${BASE.name}` : "No se ha aplicado ningún cambio");
  };
};

function refreshCertPanel(){

Object.assign(actions, {
  mode(el){
    P.mode = el.dataset.m === "cert" ? "cert" : "presu"; ensureIds(P);
    $("#baseBody").innerHTML = ""; renderAll(); renderBase(); markDirty();
  },
  newCert(){

    P.certs.push(c); P.curCert = c.id;
    renderAll(); renderCertPanel(); markDirty();

  },
  selCert(el){ P.curCert = el.dataset.id; renderAll(); renderCertPanel(); markDirty(); },
  closeCert(){

  },
  reopenCert(){ const c = P.certs[curCertIdx()]; c.closed = false; renderAll(); renderCertPanel(); markDirty(); toast(`C${c.n} reabierta`); },
  delCert(){
    const ci = curCertIdx(), c = P.certs[ci];
    modal(`Eliminar la certificación nº ${c.n}`, `<p>Se perderá todo lo anotado en ella.</p>`,
      [{ label: "Cancelar" }, { label: "Eliminar", danger: true, primary: true, run: () => { P.certs.splice(ci, 1); P.curCert = (P.certs[P.certs.length - 1] || {}).id; renderAll(); renderCertPanel(); markDirty(); } }]);
  },
  chkAll(){
    const x = certEntry(); if (!x) return;
    const src = x.it.lines.length ? x.it.lines.map(l => l.id) : ["__all"];
    for (const id of src){ const at = lineCertAt(P, x.it, id); if ((at < 0 || at === x.ci) && !x.e.chk.includes(id)) x.e.chk.push(id); }
    afterCertChange(true);
  },
  chkNone(){ const x = certEntry(); if (!x) return; x.e.chk = []; afterCertChange(true); },
  goItem(el){
    const f = findItem(el.dataset.id); if (!f) return;
    let c = f.chap; while (c){ c.collapsed = false; c = c.parentId ? findChap(c.parentId) : null; }
    sel = { chap: f.chap.id, item: f.item.id }; renderTree(); renderDetail(); if (isNarrow()) showTab("detail");
  }
});

function buildPdfCert(P, ci){
  const { jsPDF } = window.jspdf;

  const cert = P.certs[ci], L = 15, R = 198, BOTTOM = 279;
  const now = new Date(), footDate = `${now.getDate()} ${MESES[now.getMonth()]} ${now.getFullYear()}`;
  const T = certTotals(P, ci), LB = docLabels(P), D = Object.assign({ lugar: "", firmasCert: "La dirección facultativa; El contratista" }, P.doc || {});
  const X = { ud: 101, ant: 121, act: 135, ori: 149, pre: 163, iact: 180, iori: R };
  let y = 0, page = 0, mode = "res", anyOjo = false;
  const font = (st, sz) => { doc.setFont("helvetica", st); doc.setFontSize(sz); };
  const txt = (t, x, yy, o) => doc.text(pdfSafe(t), x, yy, o);
  const wrap = (t, w) => doc.splitTextToSize(pdfSafe(t), w);
  const right = (t, x, yy) => doc.text(pdfSafe(t), x, yy, { align: "right" });
  const dots = (x1, x2, yy) => { const n = Math.floor((x2 - x1) / doc.getTextWidth(".")); if (n > 0) doc.text(".".repeat(n), x1, yy); };
  function newPage(){
    if (page > 0) doc.addPage(); page++;
    doc.setTextColor(0);
    font("bold", 13); txt(mode === "res" ? "RESUMEN DE CERTIFICACIÓN" : "RELACIÓN VALORADA A ORIGEN", L, 16);
    font("bold", 9); right(`CERTIFICACIÓN Nº ${cert.n} · ${String(cert.label || "").toUpperCase()}`, R, 16);
    font("bold", 8); txt(String(P.name || "").toUpperCase().slice(0, 120), L, 20.5);
    font("bold", 6.5);
    if (mode === "res"){ txt("CAPÍTULO", L, 25); txt("RESUMEN", 38, 25); right("ANTERIOR", 140, 25); right("ACTUAL", 162, 25); right("A ORIGEN", 184, 25); right("%", R, 25); }
    else { txt("CÓDIGO", L, 25); txt("RESUMEN", 38, 25); txt("UD", X.ud, 25); [["ANTERIOR", "ant"], ["ACTUAL", "act"], ["ORIGEN", "ori"], ["PRECIO", "pre"], ["IMP. ACTUAL", "iact"], ["IMP. ORIGEN", "iori"]].forEach(([t, k]) => right(t, X[k], 25)); }
    doc.setLineWidth(0.3); doc.line(L, 26.5, R, 26.5); doc.line(L, 286, R, 286);
    font("normal", 7.5); txt(footDate, L, 290); right(String(page), R, 290);
    y = 32;
  }
  const ensure = h => { if (y + h > BOTTOM) newPage(); };
  const order = chapOrder(P), tops = order.filter(o => o.depth === 0).map(o => o.ch), memo = {};
  for (const ch of P.chapters) for (const it of ch.items) if (itemCert(P, it, ci).ojo) anyOjo = true;

  /* Resumen */
  newPage();
  font("normal", 7.5);
  for (const ch of tops){
    ensure(5.5);
    const s = chapCert(P, ch, ci, memo);
    txt(ch.code, L, y);
    const s1 = wrap(String(ch.summary || "").toUpperCase() + (s.ojo ? " *" : ""), 72)[0] || "";
    doc.text(s1, 38, y); dots(38 + doc.getTextWidth(s1) + 1, 118, y);
    right(m2(s.iAnt), 140, y); right(m2(s.iAct), 162, y); right(m2(s.iOri), 184, y); right(NFU.format(s.iPres ? Math.round(s.iOri / s.iPres * 1000) / 10 : 0), R, y);
    y += 5.6;
  }
  ensure(60); y += 2;
  doc.setLineWidth(0.3); doc.line(100, y - 3.5, R, y - 3.5);
  const lv = (label, k, bold) => { ensure(5); font(bold ? "bold" : "normal", 7.5); right(label, 116, y); right(m2(T.ant[k]), 140, y); right(m2(T.act[k]), 162, y); right(m2(T.ori[k]), 184, y); y += bold ? 5.2 : 4.4; };
  lv("PRESUPUESTO DE EJECUCIÓN MATERIAL", "pem", true);
  lv(`${m2(parseNum(P.gg))} % Gastos generales`, "gg");
  lv(`${m2(parseNum(P.bi))} % Beneficio industrial`, "bi");
  if (parseNum(P.baja)) lv(`Baja de adjudicación ${m2(parseNum(P.baja))} %`, "baja");
  doc.line(120, y - 3.2, 184, y - 3.2);
  lv(LB.contrata.toUpperCase(), "base", true);
  lv(`${NFU.format(parseNum(P.iva))}% IVA`, "iva");
  doc.line(120, y - 3.2, 184, y - 3.2);
  lv("TOTAL", "total", true);
  y += 4;
  font("normal", 9);
  const imp = wrap(`Importa la presente certificación la cantidad de ${numLetras(T.act.total)}${T.act.total < 0 ? " (negativa)" : ""}`, 150);
  doc.text(imp, 38, y); y += imp.length * 4 + 4;
  if (anyOjo){ font("italic", 7.5); doc.setTextColor(140, 80, 0); const n = wrap("* Esta certificación incluye cantidades introducidas manualmente, no vinculadas a líneas de medición. Se regularizarán en certificaciones posteriores o en la liquidación.", 150); doc.text(n, 38, y); y += n.length * 3.4 + 4; doc.setTextColor(0); }
  font("normal", 8); txt(`${D.lugar ? D.lugar + ", " : ""}${cert.fecha || mesAnio()}.`, 110, y + 2, { align: "center" }); y += 24;
  const firmas = String(D.firmasCert || "").split(";").map(s => s.trim()).filter(Boolean);
  if (firmas.length){ const step = 150 / firmas.length; firmas.forEach((f, i) => txt(f, 40 + step * i + step / 2 - 20, y)); }

  /* Relación valorada */
  mode = "rv"; newPage();
  const kids = id => order.filter(o => o.ch.parentId === id && o.ch.id !== id).map(o => o.ch);
  function renderItem(it){
    const x = itemCert(P, it, ci);
    if (!x.ori && !x.act) return;
    const e = cert.items[it.id] || {};
    font("normal", 6.5);
    const head = wrap(String(it.summary || "") + (x.ojo ? " *" : ""), 62);
    ensure(4 + head.length * 2.8);
    font("bold", 6.5); txt(it.code, L, y);

    right(m2(x.ant), X.ant, y); font("bold", 6.5); right(m2(x.act), X.act, y); font("normal", 6.5); right(m2(x.ori), X.ori, y);
    right(m2(it.price), X.pre, y); right(m2(x.iAct), X.iact, y); right(m2(x.iOri), X.iori, y);
    y += head.length * 2.8 + 0.6;
    doc.setTextColor(95);
    font("normal", 6);
    const chk = new Set(e.chk || []);
    const done = it.lines.length ? it.lines.filter(l => chk.has(l.id)) : (chk.has("__all") ? [{ c: "Partida completa", __all: true }] : []);
    for (const l of done){ ensure(3); txt("· " + (l.c || "Línea de medición") + (bimOut(l.bim) ? "  [Id " + l.bim + "]" : ""), 41, y); right(m2(l.__all ? itemQty(it) : lineParcial(l)), X.act, y); y += 2.7; }
    if (parseNum(e.ojo)){ ensure(3); doc.setTextColor(140, 80, 0); txt("* Cantidad introducida manualmente" + (e.nota ? ": " + e.nota : ""), 41, y); right(m2(parseNum(e.ojo)), X.act, y); y += 2.7; }
    doc.setTextColor(0); y += 1.8;
  }
  function renderChap(ch, depth){
    const s = chapCert(P, ch, ci, memo);
    if (!s.iOri && !s.iAct) return;
    ensure(14);
    doc.setFillColor(depth ? 244 : 236, depth ? 236 : 224, depth ? 222 : 200);
    doc.rect(L, y - 3.8, R - L, 5.2, "F");
    font("bold", depth ? 8 : 9); txt(ch.code, L + 0.5, y); doc.text(wrap(String(ch.summary || "").toUpperCase(), 140)[0] || "", 38, y);
    y += 6.5;
    ch.items.forEach(renderItem);
    kids(ch.id).forEach(k => renderChap(k, depth + 1));
    ensure(7); font("bold", depth ? 7.5 : 8.5);
    const label = pdfSafe(`TOTAL ${ch.code}`), lx = depth ? 90 : 70;
    doc.text(label, lx, y); dots(lx + doc.getTextWidth(label) + 1, 162, y); right(m2(s.iAct), X.iact, y); right(m2(s.iOri), X.iori, y);
    y += 7;
  }
  tops.forEach(ch => renderChap(ch, 0));
  ensure(8); doc.setLineWidth(0.3); doc.line(L, y - 4, R, y - 4);
  font("bold", 8.5); doc.text("TOTAL EJECUCIÓN MATERIAL", 38, y); dots(38 + doc.getTextWidth("TOTAL EJECUCIÓN MATERIAL") + 1, 162, y); right(m2(T.act.pem), X.iact, y); right(m2(T.ori.pem), X.iori, y);
  return doc.output("arraybuffer");
}
function buildXlsxCert(P, ci){
  const wb = XLSX.utils.book_new(), cert = P.certs[ci], T = certTotals(P, ci), LB = docLabels(P), FMT2 = "#,##0.00";
  const rows = [[`${P.name} · Certificación nº ${cert.n} · ${cert.label || ""}`], [],
    ["Código", "Ud", "Resumen", "Presupuesto", "Anterior", "Este periodo", "A origen", "Precio", "Imp. anterior", "Imp. periodo", "Imp. origen", "% origen", "Cantidad introducida manualmente"]];
  const fc = [], memo = {};
  for (const { ch } of chapOrder(P)){
    const s = chapCert(P, ch, ci, memo);
    const r0 = rows.length; rows.push([ch.code, "", ch.summary, "", "", "", "", "", s.iAnt, s.iAct, s.iOri, s.iPres ? s.iOri / s.iPres : 0, s.ojo ? "Sí" : ""]);
    [8, 9, 10].forEach(c => fc.push({ r: r0, c, z: FMT2 })); fc.push({ r: r0, c: 11, z: "0.0%" });
    for (const it of ch.items){
      const x = itemCert(P, it, ci), e = cert.items[it.id] || {}, r = rows.length, R1 = r + 1;
      rows.push([it.code, it.unit, it.summary, x.pres, x.ant, x.act, x.ori, it.price, x.iAnt, x.iAct, x.iOri, x.pres ? x.ori / x.pres : 0, x.ojo ? `${m2(parseNum(e.ojo))}${e.nota ? " · " + e.nota : ""}` : ""]);
      fc.push({ r, c: 6, f: `E${R1}+F${R1}` }, { r, c: 8, f: `ROUND(E${R1}*H${R1},2)` }, { r, c: 10, f: `ROUND(G${R1}*H${R1},2)` }, { r, c: 9, f: `K${R1}-I${R1}` }, { r, c: 11, f: `IF(D${R1}=0,0,G${R1}/D${R1})`, z: "0.0%" });
      [3, 4, 5, 7].forEach(c => fc.push({ r, c, z: FMT2 }));
    }
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  for (const f of fc){ const a = XLSX.utils.encode_cell({ r: f.r, c: f.c }); const cell = ws[a] || { t: "n", v: 0 }; if (f.f) cell.f = f.f; cell.z = f.z || cell.z || FMT2; ws[a] = cell; }
  ws["!cols"] = [{ wch: 14 }, { wch: 5 }, { wch: 55 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 9 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 9 }, { wch: 28 }];
  XLSX.utils.book_append_sheet(wb, ws, `Certificación ${cert.n}`);
  const rr = [[`Resumen · Certificación nº ${cert.n}`], [], ["", "Anterior", "Este periodo", "A origen"]];
  const lv = [["Ejecución material", "pem"], [`Gastos generales ${m2(parseNum(P.gg))} %`, "gg"], [`Beneficio industrial ${m2(parseNum(P.bi))} %`, "bi"]];
  if (parseNum(P.baja)) lv.push([`Baja de adjudicación ${m2(parseNum(P.baja))} %`, "baja"]);
  lv.push([LB.contrata, "base"], [`IVA ${NFU.format(parseNum(P.iva))} %`, "iva"], ["Total", "total"]);
  lv.forEach(([l, k]) => rr.push([l, T.ant[k], T.act[k], T.ori[k]]));
  const ws2 = XLSX.utils.aoa_to_sheet(rr);
  for (let r = 3; r < rr.length; r++) for (let c = 1; c <= 3; c++){ const a = XLSX.utils.encode_cell({ r, c }); if (ws2[a]) ws2[a].z = FMT2; }
  ws2["!cols"] = [{ wch: 40 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Resumen");
  return wb;
}

/* --- Eventos --- */
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]"); if (tab) return showTab(tab.dataset.tab);
  const el = e.target.closest("[data-act]");
  if (!el || el.closest("#modalRoot")) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = actions[el.dataset.act];
  if (fn){ if (["toggle", "addFromBase", "delLine", "baseGo"].includes(el.dataset.act)) e.stopPropagation(); fn(el, e); }
});
document.addEventListener("keydown", e => {
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){ e.preventDefault(); stepItem(e.key === "ArrowUp" ? -1 : 1); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.row[role="button"]')){ e.preventDefault(); actions[e.target.dataset.act](e.target, e); }
});
$("#pName").addEventListener("input", e => { P.name = e.target.value; markDirty(); });
$("#pCode").addEventListener("input", e => { P.code = e.target.value.replace(/[|~\\#\s]/g, ""); markDirty(); });
$("#summary").addEventListener("input", e => {
  const k = e.target.dataset.pct; if (!k) return;
  P[k] = parseNum(e.target.value); renderHeader(); renderSummary(); markDirty();
});
$("#detail").addEventListener("change", e => {
  const t = e.target;
  if (!isCert() || !t.dataset.chk) return;
  const x = certEntry(); if (!x) return;
  const id = t.dataset.chk;
  x.e.chk = x.e.chk.filter(v => v !== id);
  if (t.checked) x.e.chk.push(id);
  afterCertChange(true);
});
$("#baseBody").addEventListener("input", e => {
  const t = e.target, k = t.dataset.cp; if (!k || !isCert()) return;
  const ci = curCertIdx(); if (ci < 0 || P.certs[ci].closed) return;
  if (k === "baja") P.baja = parseNum(t.value); else P.certs[ci][k] = t.value;

$("#detail").addEventListener("input", e => {
  const t = e.target;
  if (isCert()){
    const x = certEntry(); if (!x) return;
    if ("ojo" in t.dataset) x.e.ojo = isBlank(t.value) ? "" : String(parseNum(t.value));
    else if ("nota" in t.dataset) x.e.nota = t.value;
    else return;
    afterCertChange(false); return;
  }
  if (t.dataset.cf){
    const ch = findChap(sel.chap); if (!ch) return;
    ch[t.dataset.cf] = t.dataset.cf === "code" ? t.value.replace(/[|~\\#\s]/g, "") : t.value;
    renderTree(); markDirty(); return;
  }
  const f = sel.item ? findItem(sel.item) : null; if (!f) return;
  const it = f.item;
  if (t.dataset.if){
    const k = t.dataset.if;
    if (k === "price"){
      it.price = r2(parseNum(t.value));
      if (it.decomp.length) {
        const was = it.priceEdited;
        it.priceEdited = Math.abs(it.price - decompRows(it.decomp, P.concepts).total) > 0.004;
        if (was !== it.priceEdited) { const pos = t.selectionStart; renderDetail(); const ni = document.querySelector('[data-if="price"]'); if (ni){ ni.focus(); try { ni.setSelectionRange(pos, pos); } catch(_){} } }
      }
    }
    else if (k === "qty") it.qty = isBlank(t.value) ? "" : String(parseNum(t.value));
    else if (k === "incr"){ it.incr = isBlank(t.value) ? "" : String(parseNum(t.value)); syncIncr(it); if (it.lines.length) { refreshTreeAmounts(); markDirty(); return renderDetailKeepFocus("incr"); } }
    else if (k === "code") it.code = t.value.replace(/[|~\\#\s]/g, "");
    else it[k] = t.value;
    refreshDetailTotals(it); refreshTreeAmounts(); markDirty(); return;
  }
  if (t.dataset.lf){
    const tr = t.closest("tr"); const l = it.lines[+tr.dataset.li]; if (!l) return;
    const k = t.dataset.lf;
    if (k === "pf"){ l.pf = t.value; return; }   // se aplica al salir del campo (evento change)
    l[k] = k === "c" ? t.value : k === "bim" ? t.value.trim() : (isBlank(t.value) ? "" : String(parseNum(t.value)));
    if (k === "c") l.cAuto = false;
    if (k === "h" && l.pf){ const r = ACERO.lookup(l.pf); l.kgSrc = r && Math.abs(r.kg - parseNum(l.h)) < 0.0005 ? "p" : "m"; t.classList.toggle("kg-man", l.kgSrc === "m"); }
    tr.querySelector(".parc").textContent = m2(lineParcial(l));
    if (esKg(it) && parseNum(it.incr) > 0){ syncIncr(it); const a = document.querySelector('#measTable tr[data-auto] .parc'); if (a){ const al = it.lines.find(x => x.bim === "AUTO:despuntes"); a.textContent = m2(lineParcial(al)); a.parentElement.querySelector(".al-l").textContent = m2(parseNum(al.l)); } }
    refreshDetailTotals(it); refreshTreeAmounts(); markDirty();
  }
});
$("#detail").addEventListener("change", e => {
  const t = e.target; if (t.dataset.lf !== "pf") return;
  const f = findItem(sel.item); if (!f) return;
  const it = f.item, tr = t.closest("tr"), l = it.lines[+tr.dataset.li]; if (!l) return;
  l.pf = t.value.trim();
  if (!l.pf){ delete l.kgSrc; markDirty(); return; }
  const r = ACERO.lookup(l.pf);
  if (!r){ t.classList.add("pf-bad"); toast(`«${l.pf}» no está en el prontuario: escribe el peso por metro a mano`); markDirty(); return; }
  l.pf = r.name; l.h = String(r.kg); l.kgSrc = "p";
  if (!l.c || l.cAuto){ l.c = `${r.name} · ${String(r.kg).replace(".", ",")} ${r.ud}`; l.cAuto = true; }
  syncIncr(it); refreshTreeAmounts(); markDirty(); renderDetailKeepFocus(null, +tr.dataset.li);
});
function renderDetailKeepFocus(field, li){
  renderDetailInner();
  const sel2 = field ? `[data-if="${field}"]` : `#measTable tr[data-li="${li}"] [data-lf="l"]`;
  const el = document.querySelector(sel2); if (el){ el.focus(); if (el.select) el.select(); }
}
$("#detail").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.lf){
    e.preventDefault();
    const tr = e.target.closest("tr"), f = findItem(sel.item);
    if (tr && f && +tr.dataset.li === f.item.lines.length - 1) actions.addLine();
    else if (tr && tr.nextElementSibling){ const n = tr.nextElementSibling.querySelector(`[data-lf="${e.target.dataset.lf}"]`); n && n.focus(); }
  }
});
$("#detail").addEventListener("paste", e => {
  if (!e.target.dataset.lf) return;
  const txt = (e.clipboardData || window.clipboardData).getData("text");
  if (!/\t|\n/.test(txt.trim())) return;
  e.preventDefault(); addPastedLines(txt);
});

/* --- Archivos --- */
function readBuf(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); }); }
$("#fBase").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  toast("Leyendo " + file.name + "…");
  try {
    const { text } = decodeBC3(await readBuf(file));
    const parsed = parseBC3Text(text);
    const rootC = Object.values(parsed.concepts).find(c => c.isRoot);
    BASE = buildBase(parsed, rootC && rootC.summary ? rootC.summary : file.name.replace(/\.bc3$/i, ""));
    if (!BASE.count) throw new Error("vacío");
    buildIndex(); openRes = null;
    $("#baseBody").innerHTML = ""; renderBase();
    const ok = await store.set("base", BASE);
    toast(`Base cargada: ${BASE.count.toLocaleString("es-ES")} conceptos` + (ok ? "" : " (no se ha podido guardar en el navegador)"));
    if (isNarrow()) showTab("base");
  } catch(err){ toast("No se ha podido leer el BC3. Comprueba que es un archivo FIEBDC-3."); }
});
$("#fOpen").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const buf = await readBuf(file);
    let np;
    if (/\.json$/i.test(file.name)){
      np = JSON.parse(new TextDecoder("utf-8").decode(buf));
      if (!np || !Array.isArray(np.chapters)) throw new Error("formato");
      np = Object.assign(newProject(), np);
    } else {
      np = budgetFromParsed(parseBC3Text(decodeBC3(buf).text), file.name.replace(/\.bc3$/i, ""));
      if (!np.chapters.length) throw new Error("sin capítulos");
    }
    const apply = () => { P = np; sel = { chap: P.chapters[0] ? P.chapters[0].id : null, item: null }; renderAll(); markDirty();
      toast(`Abierto: ${P.chapters.length} capítulos, ${P.chapters.reduce((s, c) => s + c.items.length, 0)} partidas`); if (isNarrow()) showTab("tree"); };
    if (P.chapters.length) modal("Abrir presupuesto", `<p>Se sustituirá el presupuesto actual por «${esc(file.name)}».</p>`,
      [{ label: "Cancelar" }, { label: "Guardar copia antes", run: () => actions.saveJson() }, { label: "Abrir", primary: true, run: apply }]);
    else apply();
  } catch(err){ toast("No se ha podido abrir el archivo. Usa un BC3 de presupuesto o un JSON guardado desde aquí."); }
});
$("#fMeas").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const buf = await readBuf(file);
    let text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
    if (text.includes("\ufffd")) text = new TextDecoder("windows-1252").decode(buf);
    let rows = parseMeasFile(text, file.name);
    if (!rows.length) throw new Error("vacío");
    // Familias de partidas (código «@…»): la partida concreta se elige por la medida de cada elemento
    const famOk = [], famErr = [];
    if (rows.some(r => /^@/.test(r.code))){
      const F = familias(), fm = x => String(r2(x)).replace(".", ",");
      rows = rows.filter(r => {
        if (!/^@/.test(r.code)) return true;
        if (!BASE){ famErr.push(`${r.code}: carga la base de precios para elegir la partida`); return false; }
        const fam = F[r.code], w = parseNum(r.line.a) || parseNum(r.line.l), h = parseNum(r.line.h);
        if (!fam){ famErr.push(`${r.code}: esa familia no existe en la base cargada`); return false; }
        if (!(w > 0 && h > 0)){ famErr.push(`${r.code} ${r.line.c || ""}: faltan ancho y alto`); return false; }
        const res = resolverFamilia(fam, w, h);
        if (res.error){ famErr.push(`${r.line.c || r.code} (${fm(w)} × ${fm(h)}): ${res.error}`); return false; }
        r.fam = r.code; r.code = res.code;
        r.line.c = `${r.line.c ? r.line.c + " · " : ""}${fm(w)} × ${fm(h)} (${res.como})`;
        if (res.unit === "ud"){ r.line.l = ""; r.line.a = ""; r.line.h = ""; if (isBlank(r.line.n)) r.line.n = "1"; }
        else { r.line.l = String(w); r.line.a = ""; r.line.h = String(h); }
        famOk.push(r); return true;
      });
      // Si un elemento ha cambiado de medida y de partida, se retira de la partida anterior de su familia
      for (const r of famOk){
        if (!r.line.bim) continue;
        const codes = new Set(F[r.fam].items.map(x => x.code));
        for (const ch of P.chapters) for (const it of ch.items){
          if (it.code === r.code || !codes.has(it.code)) continue;
          it.lines = it.lines.filter(l => l.bim !== r.line.bim || lineCertAt(P, it, l.id) >= 0);
        }
      }
    }
    const unitOf = code => { const f = P.chapters.flatMap(c => c.items).find(i => i.code === code); return (f && f.unit) || (BASE && BASE.map[code] && BASE.map[code].unit) || ""; };
    let nAcero = 0;
    const modoDe = code => { const f = P.chapters.flatMap(c => c.items).find(i => i.code === code); if (f) return aceroModo(f); const b = BASE && BASE.map[code]; return b ? aceroModo({ unit: b.unit, summary: b.summary, text: b.text }) : null; };
    rows.forEach(r => { if (/^kg$/i.test(unitOf(r.code)) && modoDe(r.code) && isBlank(r.line.h) && aceroAplicar(r.line)){ nAcero++; const lc = r.line.c && ACERO.lookup(r.line.c); if (!r.line.c || (lc && lc.name === r.line.pf)) r.line.c = r.line.pf + " · " + String(r.line.h).replace(".", ",") + " kg/m"; } });
    if (nAcero) setTimeout(() => toast(`${nAcero} líneas de acero con el peso del prontuario`), 1500);
    const byCode = {}; rows.forEach(r => (byCode[r.code] = byCode[r.code] || []).push(r.line));
    ensureIds(P);
    const st = { upd: 0, add: 0, del: 0, kept: 0, created: 0 }, assigned = [], missing = [], keptList = [];
    const destFor = code => {
      let best = null;
      for (const c of P.chapters) if (c.code && code.startsWith(c.code) && (!best || c.code.length > best.code.length)) best = c;
      if (best) return best;
      // Sin capítulo propio: crea el capítulo principal de la base al que pertenece (E06, E13…)
      const pre = code.slice(0, 3), bc = BASE && BASE.map[pre];
      if (bc && bc.isChapter){
        const ch = { id: uid("c"), code: pre, summary: bc.summary, items: [], collapsed: false, parentId: null };
        const nxt = P.chapters.findIndex(c => !c.parentId && c.code > pre);
        if (nxt < 0) P.chapters.push(ch); else P.chapters.splice(nxt, 0, ch);
        return ch;
      }
      return P.chapters.find(c => c.summary === "Mediciones importadas" || c.summary === "Mediciones Revit") || addChapter("Mediciones importadas");
    };
    for (const code in byCode){
      let it = null;
      for (const c of P.chapters){ it = c.items.find(i => i.code === code); if (it) break; }
      if (!it && BASE && BASE.map[code] && !BASE.map[code].isChapter){
        it = itemFromConcept(BASE.map[code], BASE.map, P.concepts); destFor(code).items.push(it); st.created++;
      }
      if (!it){ missing.push(code); continue; }
      if (!it.lines.length && parseNum(it.qty)) it.lines.push({ id: uid("l"), c: "Cantidad anterior", n: "", l: String(parseNum(it.qty)), a: "", h: "", bim: "" });
      it.qty = "";
      // Sincronización por Id del elemento: actualiza, añade y retira; respeta líneas manuales y certificadas
      const incoming = byCode[code], seen = new Set();
      for (const nl of incoming){
        const ex = nl.bim ? it.lines.find(l => l.bim === nl.bim) : null;
        if (ex){ Object.assign(ex, { c: nl.c, n: nl.n, l: nl.l, a: nl.a, h: nl.h }); seen.add(ex.id); st.upd++; }
        else { const l = Object.assign({ id: uid("l") }, nl); it.lines.push(l); seen.add(l.id); st.add++; }
      }
      it.lines = it.lines.filter(l => {
        if (isBlank(l.bim) || /^AUTO:/.test(l.bim) || seen.has(l.id)) return true;
        if (lineCertAt(P, it, l.id) >= 0){ st.kept++; keptList.push(`${code} · Id ${l.bim}`); return true; }
        st.del++; return false;
      });
      assigned.push(code);
    }
    renderAll(); markDirty();
    modal("Mediciones sincronizadas", `<p>${assigned.length} partidas: ${st.upd} líneas actualizadas, ${st.add} nuevas y ${st.del} retiradas porque ese elemento ya no viene en el archivo.${st.created ? ` Se han creado ${st.created} partidas desde la base.` : ""}</p>
      <p>Las líneas sin Id (las que metes a mano) no se tocan.</p>
      ${st.kept ? `<p>Se conservan ${st.kept} líneas que ya no vienen del modelo pero están certificadas; revísalas:</p><pre>${esc(keptList.join("\n"))}</pre>` : ""}
      ${missing.length ? `<p>Estos códigos no están ni en el presupuesto ni en la base cargada:</p><pre>${esc(missing.join("\n"))}</pre>` : ""}
      ${famOk.length ? `<p>${famOk.length} carpinterías con la partida elegida por su medida (familias de partidas).</p>` : ""}
      ${famErr.length ? `<p><b>Sin partida en la base</b> (necesitan precio nuevo o revisar la medida):</p><pre>${esc(famErr.join("\n"))}</pre>` : ""}`, [{ label: "Hecho", primary: true }]);
  } catch(err){ toast("No se ha podido leer el archivo de mediciones. Revisa que tenga una columna de código."); }
});

$("#fRooms").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const buf = await readBuf(file);
    const u8 = new Uint8Array(buf);
    let text = (u8[0] === 0xFF && u8[1] === 0xFE) ? new TextDecoder("utf-16le").decode(buf) : new TextDecoder("utf-8").decode(buf);
    if (text.includes("\ufffd")) text = new TextDecoder("windows-1252").decode(buf);
    text = text.replace(/^\ufeff/, "");
    let list = [];
    if (/^\s*[\[{]/.test(text)){ const d = JSON.parse(text); list = Array.isArray(d) ? d : (d.estancias || d.rooms || []); }
    else {
      // CSV propio o tabla de planificación exportada de Revit (.txt con tabuladores, fila de título, unidades)
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const norm = h => String(h || "").replace(/^"|"$/g, "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const hi = Math.max(0, lines.findIndex(l => /(^|[\t;,"])\s*"?(nombre|name)"?\s*([\t;,"]|$)/i.test(norm(l))));
      const hl = lines[hi], sep = hl.includes("\t") ? "\t" : ((hl.match(/;/g) || []).length >= (hl.match(/,/g) || []).length ? ";" : ",");
      const alias = h => ({ "altura sin limites": "altura", "altura de calculo": "altura", "altura libre": "altura", "perimetro": "perimetro", "superficie": "area", "numero": "numero", "elementid": "id", "id de elemento": "id" }[h] || h);
      const head = splitCSVLine(hl, sep).map(h => alias(norm(h)));
      for (const l of lines.slice(hi + 1)){
        const c = splitCSVLine(l, sep).map(v => v.replace(/^"|"$/g, "")), o = {};
        head.forEach((h, i) => o[h] = c[i]);
        if (!o.nombre && !o.name) continue;
        if (!o.id && o.numero) o.id = "N" + o.numero;          // sin Id de Revit, el número de la estancia hace de identificador
        if (!(parseNum(o.area) > 0)) continue;                  // estancias sin colocar (sin área)
        list.push(o);
      }
    }
    P.rooms = P.rooms || []; let add = 0, upd = 0;
    for (const o of list){
      const id = String(o.id || o.idrevit || o.elementid || ""), name = o.nombre || o.name || "Estancia";
      const fz = String(o.fase || o.phase || "");
      const ph = /proy|reform|nuev|02/i.test(fz) ? "proy" : (/actual|exist|01/i.test(fz) ? "act" : "unica");
      const ex = id ? P.rooms.find(r => r.bim === id) : null;
      const data = { name, phase: ph, area: String(parseNum(o.area)), perim: String(parseNum(o.perimetro || o.perimeter)), height: String(parseNum(o.altura || o.height)), huecos: o.huecos || "" };
      if (ex){ Object.assign(ex, data, { huecos: ex.huecos || data.huecos }); rfPhaseFit(ex); upd++; }
      else { P.rooms.push(Object.assign({ id: id ? "R" + id : uid("r"), bim: id, a: { hAlic: 2.2 } }, data)); add++; }
    }
    const cnt = ph => P.rooms.filter(r => r.phase === ph).length;
    markDirty(); rfRender();
    toast(`${add} estancias añadidas y ${upd} actualizadas · ${cnt("act")} del estado actual, ${cnt("proy")} del proyectado${cnt("unica") ? `, ${cnt("unica")} sin fase` : ""}`);
  } catch(err){ toast("No se ha podido leer el archivo de estancias"); }
});
